# Spike 3b: MCP 工具桥全链路驱动 — cordis.yml（8 插件 + mcp-lanyuan 业务工具桥）
# 基于 cordis-jsonrpc.yml（1d 验证过的 npm runtime 8 插件），追加 mcp-lanyuan 条目。
# mcp-lanyuan: @deepseek-ai/dsh-mcp-client spawn Python MCP server（stdio 子进程），
# 工具注册为 mcp__lanyuan__search_history / mcp__lanyuan__get_profile。
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

# MCP 工具桥：Python 业务工具 server（stdio transport，DSH spawn 子进程）
- id: mcp-lanyuan
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: lanyuan
    transport: stdio
    command: /home/ubuntu/.hermes/profiles/dev/workspace/lanyuan-base-feat-82/spike/.venv/bin/python
    args:
      - /home/ubuntu/.hermes/profiles/dev/workspace/lanyuan-base-feat-82/spike/3_lanyuan_mcp_server.py
