[project]
name = "lanyuan-base-backend"
version = "0.1.0"
description = "兰园公共底座 - 后端"
requires-python = ">=3.11"

[project.scripts]
replay-llm = "scripts.replay_llm:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
