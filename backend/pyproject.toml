[project]
name = "lanyuan-base-backend"
version = "0.1.0"
description = "兰园公共底座 - 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "aiomysql>=0.3.0",
    "PyMySQL>=1.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "cachetools>=5.5.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.0",
    "passlib[bcrypt]>=1.7.4",
    "fastmcp>=3.4.0",
    "deepseek-harness-sdk==0.1.1rc1",
]

[project.scripts]
replay-llm = "scripts.replay_llm:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"alembic/env.py" = ["E402"]
"seed_data.py" = ["E501"]
"scripts/*.py" = ["INP001"]
"tests/*.py" = ["F841"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
