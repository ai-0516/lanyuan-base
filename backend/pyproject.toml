[project]
name = "lanyuan-base-backend"
version = "0.1.0"
description = "兰园公共底座 - 后端"
requires-python = ">=3.11"
dependencies = [
    "deepseek-harness-sdk==0.1.1rc1",
]

[project.scripts]
replay-llm = "scripts.replay_llm:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"alembic/env.py" = ["E402"]
"seed_data.py" = ["E501"]
"scripts/*.py" = ["INP001"]
"tests/*.py" = ["F841"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
