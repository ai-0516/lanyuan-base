name: Backend CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          pytest tests/ -v --tb=short --cov=app 2>&1 | tee /tmp/coverage.txt

      - name: Generate HTML coverage report
        run: pytest --cov=app --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
          retention-days: 7

      - name: Coverage summary
        if: always()
        run: |
          echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^(Name |app/|TOTAL|---)" /tmp/coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Post coverage comment to PR
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('/tmp/coverage.txt', 'utf8');
            const lines = coverage.split('\n').filter(l => /^(Name |app\/|TOTAL|---)/.test(l));

            const body = `## 📊 Coverage Report\n\n\`\`\`\n${lines.join('\n')}\n\`\`\``;

            const branch = context.ref.replace('refs/heads/', '');

            if (branch === 'main') {
              console.log('On main branch, skipping PR comment');
              return;
            }

            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });

            if (pulls.length === 0) {
              console.log(`No open PR found for branch ${branch}`);
              return;
            }

            const prNumber = pulls[0].number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const covComment = comments.find(c => c.body.includes('Coverage Report'));

            // 删旧重建，让 comment 始终在 PR 最底部
            if (covComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: covComment.id,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

      - name: Test replay-llm --help
        run: python scripts/replay_llm.py --help

  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Install dependencies
        # 自建 venv + 激活 PATH（#59 修复）：setup-uv 的 VIRTUAL_ENV 与 pip 目标环境
        # 不一致（pip 装到 python3.12 user site，python 命令是 3.11）→ 显式统一
        run: |
          uv venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          uv pip install --python .venv/bin/python -r requirements.txt

      # 无 LLM 类评测（#59）：不需要 LLM key，CI 可直接跑；有 LLM 类（--llm 门控）不挂 CI
      - name: Run no-LLM evals (pytest -m eval)
        run: |
          set -o pipefail
          pytest -m eval -q --tb=short 2>&1 | tee /tmp/evals_pytest.txt

      - name: Run ATOF reporter on sample data
        run: |
          set -o pipefail
          python -m app.harness.evals.report tests/data/sample_atof.jsonl | tee /tmp/evals_atof.txt

      - name: Verify task set loads
        run: |
          set -o pipefail
          python - <<'EOF' | tee /tmp/evals_tasks.txt
          from app.harness.evals.harness import load_tasks
          from pathlib import Path
          tasks = load_tasks(Path("app/harness/evals/tasks"))
          print(f"加载 {len(tasks)} 个任务: {', '.join(t.name for t in tasks)}")
          assert len(tasks) >= 6, "测试集加载异常"
          EOF

      - name: Build evals report
        run: |
          {
            echo '## 📊 Evals Report（无 LLM 类，#59）'
            echo ''
            echo '### 单元测试（pytest -m eval）'
            echo '```'
            grep -E "passed" /tmp/evals_pytest.txt | tail -1
            echo '```'
            echo ''
            echo '### ATOF 报告器（sample_atof.jsonl）'
            echo '```'
            cat /tmp/evals_atof.txt
            echo '```'
            echo ''
            echo '### 测试集加载验证（app/harness/evals/tasks/）'
            echo '```'
            cat /tmp/evals_tasks.txt
            echo '```'
          } > evals-report.txt

      - name: Upload evals report
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: backend/evals-report.txt
          retention-days: 7

      - name: Post evals report to PR
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('backend/evals-report.txt', 'utf8');

            const branch = context.ref.replace('refs/heads/', '');

            if (branch === 'main') {
              console.log('On main branch, skipping PR comment');
              return;
            }

            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });

            if (pulls.length === 0) {
              console.log(`No open PR found for branch ${branch}`);
              return;
            }

            const prNumber = pulls[0].number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const evalsComment = comments.find(c => c.body.includes('Evals Report'));

            // 删旧重建，让 comment 始终在 PR 最底部（沿用 coverage 评论模式）
            if (evalsComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: evalsComment.id,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: report,
            });
