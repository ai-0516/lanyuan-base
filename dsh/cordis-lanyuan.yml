# lanyuan v2 runtime 配置（M2：6 插件，能力裁剪）
# 基于 spike cordis-jsonrpc.yml（8 插件）裁剪：去掉 subprocess/bash/fs-local
# spine 为本地 @lanyuan/dsh-agent-spine（零 examples 依赖，§7.4）
# M2 追加 mcp-client 条目（业务工具 MCP client，§6：自写插件注入 user_id）
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-core
  name: '@lanyuan/dsh-agent-spine'
  config:
    dshHome: !!js process.env.DSH_HOME ?? './.dsh-home'
    persona: >-
      你是兰园社区的 AI 小助手，帮助社区居民解答问题、查询信息、处理社区事务。
      回答简洁、友好、准确；涉及用户个人数据时以工具查询结果为准。

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# 业务工具 MCP client（§6.2）：自写插件（@lanyuan/dsh-mcp-client，替代官方
# dsh-mcp-client）经 streamable-http 消费挂载在 FastAPI /mcp 的 MCP server
# （§6.4b @mcp_tool 原生注册，如 mcp__lanyuan__get_my_profile）；
# user_id 由插件从 session id 解析并注入 callTool 的 _meta（§6.3）
- id: lanyuan-mcp-client
  name: '@lanyuan/dsh-mcp-client'
  config:
    serverName: lanyuan
    url: !!js process.env.LANYUAN_MCP_URL ?? 'http://127.0.0.1:8000/mcp/'
    toolCallTimeoutMs: 60000
