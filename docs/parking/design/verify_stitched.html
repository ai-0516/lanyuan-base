<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车位标注 - 区域对齐</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui; background:#1a1a2e; color:#eee; overflow:hidden; }
.header { background:#16213e; padding:6px 12px; display:flex; align-items:center; gap:8px; font-size:12px; flex-wrap:wrap; }
.header h1 { font-size:14px; white-space:nowrap; }
.toolbar { display:flex; gap:6px; align-items:center; margin-left:auto; flex-wrap:wrap; }
.toolbar select, .toolbar button { padding:3px 8px; border:1px solid #444; background:#1a1a2e; color:#eee; border-radius:3px; cursor:pointer; font-size:11px; }
.toolbar button.active { background:#e94560; border-color:#e94560; }
.toolbar input[type=range] { width:40px; }
.viewport { position:relative; overflow:hidden; height:calc(100vh - 48px); }
.canvas-wrap { position:absolute; transform-origin:0 0; }
.canvas-wrap img.base { display:block; }
.area-layer { position:absolute; cursor:move; border:2px dashed; opacity:0.35; transform-origin:0 0; }
.area-layer:hover { opacity:0.6; }
.area-layer.selected { border-style:solid; opacity:0.5; z-index:10; }
.area-layer img { display:block; width:100%; height:100%; }
.area-layer .handle { position:absolute; width:12px; height:12px; background:#fff; border:2px solid; border-radius:2px; }
.area-layer .handle.br { bottom:-8px; right:-8px; cursor:nwse-resize; }
.area-layer .handle.bl { bottom:-8px; left:-8px; cursor:nesw-resize; }
.area-layer .handle.tr { top:-8px; right:-8px; cursor:nesw-resize; }
.area-layer .handle.tl { top:-8px; left:-8px; cursor:nwse-resize; }
.area-layer .handle.mr { top:50%; right:-8px; transform:translateY(-50%); cursor:ew-resize; }
.area-layer .handle.ml { top:50%; left:-8px; transform:translateY(-50%); cursor:ew-resize; }
.area-layer .handle.mt { top:-8px; left:50%; transform:translateX(-50%); cursor:ns-resize; }
.area-layer .handle.mb { bottom:-8px; left:50%; transform:translateX(-50%); cursor:ns-resize; }
.spot { position:absolute; border:1px solid; font-size:8px;
  display:flex; align-items:center; justify-content:center;
  min-width:20px; height:12px; padding:0 1px; line-height:1;
  border-radius:2px; user-select:none; }
.spot.hide-label { min-width:6px; height:5px; font-size:0; padding:0; border-radius:1px; }
.info { position:absolute; bottom:8px; left:8px; background:rgba(0,0,0,0.85);
  padding:5px 10px; border-radius:4px; font-size:11px; pointer-events:none; line-height:1.5; }
</style>
</head>
<body>
<div class="header">
  <h1>🅿️ 东方兰园 1385车位 对齐工具</h1>
  <div class="toolbar">
    <label>缩放 <input type="range" id="zoom" min="5" max="100" value="15"> <span id="zoomVal">15%</span></label>
    <label><input type="checkbox" id="showLabels" checked> 编号</label>
    <span>|</span>
    <span style="color:#aaa;">选择区域：</span>
    <button onclick="selectArea('A')" class="active" id="btnA" style="border-color:#e94560;color:#e94560;">A区</button>
    <button onclick="selectArea('B')" id="btnB" style="border-color:#4a90d9;color:#4a90d9;">B区</button>
    <button onclick="selectArea('C')" id="btnC" style="border-color:#00b894;color:#00b894;">C区</button>
    <button onclick="selectArea('D')" id="btnD" style="border-color:#fdcb6e;color:#fdcb6e;">D区</button>
    <button onclick="selectArea('F')" id="btnF" style="border-color:#6c5ce7;color:#6c5ce7;">F区</button>
    <button onclick="deselectAll()">取消选择</button>
    <span>|</span>
    <label><input type="checkbox" id="showAreas" checked> 区域小图</label>
    <span>|</span>
    <button onclick="copyConfig()">📋 复制区域配置</button>
    <span>|</span>
    <span>|</span>
    <label><input type="checkbox" id="showSpots"> 显示车位</label>
    <button onclick="exportJSON()">📥 导出 JSON</button>
    <span style="color:#fdcb6e;font-size:10px;">选区域→拖移/拖角缩放→对⻬拼接图</span>
  </div>
</div>
<div class="viewport" id="vp">
  <div class="canvas-wrap" id="canvas"></div>
  <div class="info" id="info"></div>
</div>

<script>
const colors = { 'A':'rgba(233,69,96,0.4)', 'B':'rgba(74,144,217,0.4)', 'C':'rgba(0,184,148,0.4)', 'D':'rgba(253,203,110,0.4)', 'F':'rgba(108,92,231,0.4)' };
const borders = { 'A':'#e94560', 'B':'#4a90d9', 'C':'#00b894', 'D':'#fdcb6e', 'F':'#6c5ce7' };
const STW=3370, STH=4299;

// Area config: { sx, sy, sw, sh } in stitched coords — will be adjusted by user
// Load saved config or use defaults
let areaConfig = JSON.parse(localStorage.getItem('lanyuan_areaConfig') || 'null') || {
  A: { sx:279, sy:633, sw:2670, sh:1339 },
  B: { sx:1774, sy:29, sw:1858, sh:2242 },
  C: { sx:1420, sy:2317, sw:2415, sh:1457 },
  D: { sx:791, sy:2954, sw:3395, sh:2011 },
  F: { sx:239, sy:2303, sw:2957, sh:3342 },
};
let spots = [], selectedArea = 'A';
let dragTarget = null, dragType = '', dragStart = {};

async function init() {
  const resp = await fetch('parking_spots_unified.json');
  spots = await resp.json();
  
  const canvas = document.getElementById('canvas');
  
  // Base stitched image
  const baseImg = document.createElement('img');
  baseImg.className = 'base';
  baseImg.src = 'stitched_final.png';
  baseImg.style.width = STW+'px'; baseImg.style.height = STH+'px';
  baseImg.draggable = false;
  canvas.appendChild(baseImg);
  
  // Create area layers + spots
  for (const [area, cfg] of Object.entries(areaConfig)) {
    createAreaLayer(area, cfg);
  }
  
  updateInfo();
  
  document.getElementById('showLabels').onchange = toggleLabels;
  document.getElementById('showSpots').onchange = toggleSpots;
  document.getElementById('showAreas').onchange = toggleAreas;
  document.getElementById('zoom').oninput = updateZoom;
  // Start with spots hidden
  toggleSpots();
  setupPanZoom();
  
  window.addEventListener('mousemove', onDrag);
  window.addEventListener('mouseup', stopDrag);
}

function createAreaLayer(area, cfg) {
  const canvas = document.getElementById('canvas');
  
  // Remove old layer if exists
  const old = canvas.querySelector(`.area-layer[data-area="${area}"]`);
  if (old) old.remove();
  
  // Area background layer
  const layer = document.createElement('div');
  layer.className = 'area-layer';
  if (area === selectedArea) layer.classList.add('selected');
  layer.dataset.area = area;
  layer.style.left = cfg.sx + 'px';
  layer.style.top = cfg.sy + 'px';
  layer.style.width = cfg.sw + 'px';
  layer.style.height = cfg.sh + 'px';
  layer.style.borderColor = borders[area];
  
  const bg = document.createElement('img');
  bg.src = `spots_verify/${area}_bg_${area==='A'?'2566072e':area==='B'?'829d9642':area==='C'?'5c1802ae':area==='D'?'1c1d521e':'a2613602'}.png`;
  bg.draggable = false;
  layer.appendChild(bg);
  
  // Resize handles (4 corners + 4 edges)
  ['tl','tr','bl','br','mt','mb','ml','mr'].forEach(pos => {
    const h = document.createElement('div');
    h.className = 'handle ' + pos;
    h.dataset.handle = pos;
    layer.appendChild(h);
  });
  
  // Events
  layer.addEventListener('mousedown', e => startAreaDrag(e, area));
  canvas.appendChild(layer);
  
  // Create/recreate spots for this area
  canvas.querySelectorAll(`.spot[data-area="${area}"]`).forEach(s => s.remove());
  const areaSpots = spots.filter(s => s.area[0] === area);
  const showLabels = document.getElementById('showLabels').checked;
  
  areaSpots.forEach((s, i) => {
    // Spots positioned relative to area layer
    const sx = (s.img_x / s.bg_w) * cfg.sw;
    const sy = (s.img_y / s.bg_h) * cfg.sh;
    
    const el = document.createElement('div');
    el.className = 'spot' + (showLabels ? '' : ' hide-label');
    el.dataset.area = area;
    el.dataset.id = s.id;
    el.style.left = (cfg.sx + sx) + 'px';
    el.style.top = (cfg.sy + sy) + 'px';
    el.style.backgroundColor = colors[area];
    el.style.borderColor = borders[area];
    el.textContent = showLabels ? s.id : '';
    el.title = s.id;
    canvas.appendChild(el);
  });
}

function startAreaDrag(e, area) {
  if (e.target.classList.contains('handle')) {
    dragType = e.target.dataset.handle;
  } else if (e.target.closest('.area-layer') && area === selectedArea) {
    dragType = 'move';
  } else {
    return;
  }
  e.preventDefault();
  selectArea(area);
  
  const zoom = parseInt(document.getElementById('zoom').value)/100;
  const canvasRect = document.getElementById('canvas').getBoundingClientRect();
  dragTarget = area;
  dragStart = {
    x: (e.clientX - canvasRect.left) / zoom,
    y: (e.clientY - canvasRect.top) / zoom,
    cfg: { ...areaConfig[area] }
  };
}

function onDrag(e) {
  if (!dragTarget) return;
  e.preventDefault();
  
  const zoom = parseInt(document.getElementById('zoom').value)/100;
  const canvasRect = document.getElementById('canvas').getBoundingClientRect();
  const cx = (e.clientX - canvasRect.left) / zoom;
  const cy = (e.clientY - canvasRect.top) / zoom;
  const dx = cx - dragStart.x;
  const dy = cy - dragStart.y;
  const cfg = areaConfig[dragTarget];
  const orig = dragStart.cfg;
  
  if (dragType === 'move') {
    cfg.sx = orig.sx + dx;
    cfg.sy = orig.sy + dy;
  } else if (dragType === 'br') {
    cfg.sw = Math.max(100, orig.sw + dx);
    cfg.sh = Math.max(100, orig.sh + dy);
  } else if (dragType === 'bl') {
    cfg.sx = orig.sx + dx;
    cfg.sw = Math.max(100, orig.sw - dx);
    cfg.sh = Math.max(100, orig.sh + dy);
  } else if (dragType === 'tr') {
    cfg.sy = orig.sy + dy;
    cfg.sw = Math.max(100, orig.sw + dx);
    cfg.sh = Math.max(100, orig.sh - dy);
  } else if (dragType === 'tl') {
    cfg.sx = orig.sx + dx;
    cfg.sy = orig.sy + dy;
    cfg.sw = Math.max(100, orig.sw - dx);
    cfg.sh = Math.max(100, orig.sh - dy);
  } else if (dragType === 'mr') {
    cfg.sw = Math.max(100, orig.sw + dx);
  } else if (dragType === 'ml') {
    cfg.sx = orig.sx + dx;
    cfg.sw = Math.max(100, orig.sw - dx);
  } else if (dragType === 'mt') {
    cfg.sy = orig.sy + dy;
    cfg.sh = Math.max(100, orig.sh - dy);
  } else if (dragType === 'mb') {
    cfg.sh = Math.max(100, orig.sh + dy);
  }
  
  createAreaLayer(dragTarget, cfg);
  localStorage.setItem('lanyuan_areaConfig', JSON.stringify(areaConfig));
  updateInfo();
}

function stopDrag() {
  if (dragTarget) {
    updateAllSpots(dragTarget);
    localStorage.setItem('lanyuan_areaConfig', JSON.stringify(areaConfig));
  }
  dragTarget = null; dragType = '';
}

function updateAllSpots(area) {
  const cfg = areaConfig[area];
  spots.forEach(s => {
    if (s.area[0] !== area) return;
    const sx = (s.img_x / s.bg_w) * cfg.sw;
    const sy = (s.img_y / s.bg_h) * cfg.sh;
    s.stitched_x = cfg.sx + sx;
    s.stitched_y = cfg.sy + sy;
  });
}

function selectArea(area) {
  selectedArea = area;
  document.querySelectorAll('.area-layer').forEach(l => {
    l.classList.toggle('selected', l.dataset.area === area);
  });
  document.querySelectorAll('.header button[id^="btn"]').forEach(b => {
    b.classList.toggle('active', b.textContent.startsWith(area));
  });
  updateInfo();
}

function deselectAll() {
  selectedArea = null;
  document.querySelectorAll('.area-layer').forEach(l => l.classList.remove('selected'));
  document.querySelectorAll('.header button[id^="btn"]').forEach(b => b.classList.remove('active'));
}

function updateInfo() {
  const el = document.getElementById('info');
  if (selectedArea && areaConfig[selectedArea]) {
    const c = areaConfig[selectedArea];
    el.innerHTML = `<b>${selectedArea}区</b><br>位置: (${c.sx.toFixed(0)}, ${c.sy.toFixed(0)})<br>大小: ${c.sw.toFixed(0)}×${c.sh.toFixed(0)}<br>🖱 拖移 | 拖角缩放`;
  } else {
    el.innerHTML = `选择一个区域开始对齐<br>🖱 拖移 | 拖角缩放`;
  }
}

function toggleLabels() {
  const show = document.getElementById('showLabels').checked;
  document.querySelectorAll('.spot').forEach(el => {
    el.classList.toggle('hide-label', !show);
    el.textContent = show ? (el.dataset.id || '') : '';
  });
}

function updateZoom() {
  const z = document.getElementById('zoom').value;
  document.getElementById('zoomVal').textContent = z+'%';
  document.getElementById('canvas').style.transform = `scale(${z/100})`;
}

function setupPanZoom() {
  const vp = document.getElementById('vp');
  const canvas = document.getElementById('canvas');
  let panning=false, sx,sy, px=0, py=0;
  
  vp.addEventListener('wheel', e => {
    e.preventDefault();
    const s = document.getElementById('zoom');
    s.value = Math.max(5, Math.min(100, parseInt(s.value)+(e.deltaY>0?-3:3)));
    updateZoom();
  });
  
  vp.addEventListener('mousedown', e => {
    if (e.target.closest('.area-layer') || e.target.closest('.spot')) return;
    panning=true; sx=e.clientX-px; sy=e.clientY-py;
  });
  
  window.addEventListener('mousemove', e => {
    if (!panning) return;
    px=e.clientX-sx; py=e.clientY-sy;
    document.getElementById('canvas').style.translate=`${px}px ${py}px`;
  });
  
  window.addEventListener('mouseup', ()=>{panning=false;});
}

function toggleSpots() {
  const show = document.getElementById('showSpots').checked;
  document.querySelectorAll('.spot').forEach(el => {
    el.style.display = show ? '' : 'none';
  });
}

function toggleAreas() {
  const show = document.getElementById('showAreas').checked;
  document.querySelectorAll('.area-layer').forEach(el => {
    el.style.display = show ? '' : 'none';
  });
}

function copyConfig() {
  const config = JSON.stringify(areaConfig, null, 2);
  navigator.clipboard.writeText(config).then(() => {
    alert('区域配置已复制到剪贴板！发给我即可。');
  });
}

function exportJSON() {
  // Ensure all spots have updated stitched coords
  for (const area of Object.keys(areaConfig)) {
    updateAllSpots(area);
  }
  
  const data = {
    areaConfig: areaConfig,
    spots: spots,
    total: spots.length,
    stitched: { width: STW, height: STH }
  };
  
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'parking_spots_unified.json';
  a.click();
}

init();
</script>
</body>
</html>
