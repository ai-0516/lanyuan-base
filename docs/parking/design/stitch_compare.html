<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼接对比 - 第2页+第3页</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; color:#fff; font-family:system-ui; }
.header { padding:16px 20px; background:#16213e; }
.header h1 { font-size:18px; margin-bottom:4px; }
.header p { font-size:12px; color:#888; }
.grid { display:flex; flex-wrap:wrap; gap:16px; padding:16px; }
.card { flex:1; min-width:350px; background:#0f3460; border-radius:8px; overflow:hidden; }
.card h2 { padding:10px 14px; font-size:14px; background:rgba(0,0,0,0.3); }
.card img { width:100%; display:block; }
.card p { padding:8px 14px; font-size:11px; color:#aaa; }
.hint { padding:8px 20px; font-size:12px; color:#fdcb6e; }
</style>
</head>
<body>
<div class="header">
  <h1>🔗 PDF 第2页 + 第3页 拼接对比</h1>
  <p>红线 = 两页交界线 | 请找出 C区/F区 跨页处对齐最好的那张</p>
</div>
<div class="hint">💡 看红线附近的车位/道路是否连续对齐，选最好的告诉我是 overlap=200/400/600</div>
<div class="grid">
  <div class="card">
    <h2>重叠 = 200px</h2>
    <a href="stitched_ov200.png" target="_blank"><img src="stitched_ov200.png" alt="overlap=200"></a>
  </div>
  <div class="card">
    <h2>重叠 = 400px</h2>
    <a href="stitched_ov400.png" target="_blank"><img src="stitched_ov400.png" alt="overlap=400"></a>
  </div>
  <div class="card">
    <h2>重叠 = 600px</h2>
    <a href="stitched_ov600.png" target="_blank"><img src="stitched_ov600.png" alt="overlap=600"></a>
  </div>
</div>
</body>
</html>
