<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车位微调 - 东方兰园</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system;background:#1a1a2e;color:#eee;overflow:hidden}
.header{background:#16213e;padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:12px;flex-wrap:wrap;border-bottom:1px solid #333;min-height:48px;overflow:visible;z-index:100;position:relative}
.header h1{font-size:15px;white-space:nowrap}
.tabs{display:flex;gap:3px}
.tab{padding:4px 10px;border:1px solid #444;border-radius:5px;cursor:pointer;font-size:11px;background:#1a1a2e;color:#aaa}
.tab.active{background:#e94560;color:#fff;border-color:#e94560;font-weight:bold}
.toolbar{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap;font-size:11px}
.toolbar button{padding:3px 10px;border:1px solid #444;background:#1a1a2e;color:#eee;border-radius:4px;cursor:pointer;font-size:11px}
.toolbar button:hover{background:#333}
.toolbar button.save{background:#00b894;border-color:#00b894;color:#fff}
.toolbar button.export{background:#4a90d9;border-color:#4a90d9;color:#fff}
.toolbar input[type=range]{width:50px}
.toolbar input[type=number]{width:50px;height:22px;font-size:11px;background:#1a1a2e;color:#eee;border:1px solid #444;border-radius:3px;padding:1px 3px}
.toolbar label{display:flex;align-items:center;gap:3px;cursor:pointer}
.viewport{position:relative;overflow:hidden;height:calc(100vh - 48px);cursor:grab}
.viewport:active{cursor:grabbing}
.canvas-wrap{position:absolute;transform-origin:0 0}
.canvas-wrap img{display:block}
.spot-marker{position:absolute;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;color:#000;border-radius:2px;z-index:2;user-select:none}
.spot-marker:hover{z-index:10;outline:1px solid #ffd700;outline-offset:1px}
.spot-marker.selected{outline:2px solid #ffd700!important;outline-offset:2px!important;z-index:5}
.spot-marker.dragging{z-index:100;opacity:.9}
.spot-marker.modified{border-color:#ffd700!important;box-shadow:0 0 3px #ffd700}
.spot-marker.inrange{outline:1px dashed #ffd700;outline-offset:1px}
.info-bar{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.85);padding:6px 12px;border-radius:6px;font-size:11px;pointer-events:none;line-height:1.6}
.help{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);padding:4px 8px;border-radius:4px;font-size:10px;color:#888;pointer-events:none}
.select-box{position:absolute;border:1px dashed #ffd700;background:rgba(255,215,0,.08);z-index:50;pointer-events:none}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.status-dot.saved{background:#00b894}
.status-dot.modified{background:#ffd700;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="header">
  <h1>🔧 车位微调</h1>
  <span id="status"><span class="status-dot saved"></span>已加载</span>
  <div class="tabs" id="tabs"></div>
  <div class="toolbar">
    <label><input type="checkbox" id="showLabels" checked> 编号</label>
    <label>宽 <input type="number" id="spotW" min="6" max="80" value="34"></label>
    <label>高 <input type="number" id="spotH" min="6" max="100" value="34"></label>
    <label><input type="checkbox" id="spotLandscape"> 横向</label>
    <button onclick="selectRow()">📐 全选同行</button>
    <button id="undoBtn" onclick="undo()">↩ 撤销</button>
    <button onclick="resetSel()" style="color:#e17055;">全部重置</button>
    <button class="save" onclick="saveToLocal()">💾 保存</button>
    <button class="export" onclick="exportJSON()">📥 导出JSON</button>
  </div>
</div>
<div class="viewport" id="vp">
  <div class="canvas-wrap" id="canvas"></div>
  <div class="info-bar" id="info">Ctrl+点击多选 | Shift+点击范围选 | 方向键微调 | 拖空白处框选</div>
  <div class="help" id="help"></div>
</div>

<script>
const colors={'A':'#e94560','B':'#4a90d9','C':'#00b894','D':'#fdcb6e','F':'#a55eea'};
const bgFiles={'A':'A_bg_2566072e.png','B':'B_bg_829d9642.png','C':'C_bg_combined.png','D':'D_bg_1c1d521e.png','F':'F_bg_combined.png'};
const defaultSpotSizes={'A':{w:30,h:65},'B':{w:35,h:76},'C':{w:36,h:78},'D':{w:38,h:81},'F':{w:44,h:94}};

let allSpots=[],currentArea='A',bgW=0,bgH=0;
let modifications={},areaSizes={},undoStack={};
let selectedSpots=new Set();
let dragTargets=[],dragStarts=[];
let panX=0,panY=0,panning=false,panStart={};
let boxSelecting=false,boxStart={},boxEl=null;
let hasModifications=false;

try{const s=localStorage.getItem('lanyuan_spot_adjustments');if(s)modifications=JSON.parse(s);}catch(e){}
try{const s=localStorage.getItem('lanyuan_spot_areaSizes');if(s)areaSizes=JSON.parse(s);}catch(e){}

async function init(){
  const resp=await fetch('../parking_spots_cv_aligned.json');
  allSpots=await resp.json();
  const areas=['A','B','C','D','F'];
  const tabsEl=document.getElementById('tabs');
  areas.forEach(a=>{
    const c=allSpots.filter(s=>s.area[0]===a).length;
    const tab=document.createElement('div');
    tab.className='tab';tab.id='tab'+a;
    tab.textContent=`${a}区 ${c}`;
    tab.onclick=()=>switchArea(a);
    tabsEl.appendChild(tab);
  });
  document.getElementById('showLabels').onchange=toggleLabels;
  document.getElementById('spotW').oninput=onSizeChange;
  document.getElementById('spotH').oninput=onSizeChange;
  document.getElementById('spotLandscape').onchange=function(){
    if(selectedSpots.size===0)return;
    for(const id of selectedSpots){
      if(!modifications[id]){const s=allSpots.find(x=>x.id===id);modifications[id]={img_x:s.img_x,img_y:s.img_y};}
      if(this.checked)modifications[id].landscape=true;else delete modifications[id].landscape;
    }
    hasModifications=Object.keys(modifications).length>0;
    renderSpots();updateStatus();
  };
  document.getElementById('vp').addEventListener('mousedown',onMouseDown);
  window.addEventListener('mousemove',onMouseMove);
  window.addEventListener('mouseup',onMouseUp);
  window.addEventListener('keydown',onKey);
  switchArea('F');
}

function switchArea(area){
  if(currentArea&&currentArea!==area){areaSizes[currentArea]={w:parseInt(document.getElementById('spotW').value),h:parseInt(document.getElementById('spotH').value)};}
  if(hasModifications)saveToLocalQuiet();
  currentArea=area;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab'+area).classList.add('active');
  selectedSpots.clear();
  const canvas=document.getElementById('canvas');canvas.innerHTML='';
  const areaSpots=allSpots.filter(s=>s.area[0]===area);
  bgW=areaSpots[0]?.bg_w||0;bgH=areaSpots[0]?.bg_h||0;
  const bgImg=document.createElement('img');
  bgImg.src=bgFiles[area];bgImg.draggable=false;
  bgImg.style.width=bgW+'px';bgImg.style.height=bgH+'px';
  bgImg.onload=()=>{renderSpots();updateInfo();};
  canvas.appendChild(bgImg);
  panX=0;panY=0;
  const sz=areaSizes[area];
  const ds={w:Math.round(areaSpots[0]?.rect_w||defaultSpotSizes[area].w),h:Math.round(areaSpots[0]?.rect_h||defaultSpotSizes[area].h)};
  document.getElementById('spotW').value=sz?.w||ds.w;
  document.getElementById('spotH').value=sz?.h||ds.h;
  document.getElementById('spotLandscape').checked=false;
  updateHelp();
}

function getSpotPos(spot){return modifications[spot.id]?{x:modifications[spot.id].img_x,y:modifications[spot.id].img_y}:{x:spot.img_x,y:spot.img_y};}

function renderSpots(){
  const canvas=document.getElementById('canvas');
  canvas.querySelectorAll('.spot-marker').forEach(el=>el.remove());
  const areaSpots=allSpots.filter(s=>s.area[0]===currentArea);
  const showLabels=document.getElementById('showLabels').checked;
  let sw0=parseInt(document.getElementById('spotW').value);
  let sh0=parseInt(document.getElementById('spotH').value);
  areaSpots.forEach(s=>{
    const pos=getSpotPos(s);
    let sw=sw0,sh=sh0;
    const isLand=(modifications[s.id]&&modifications[s.id].landscape)||(!modifications[s.id]&&s.landscape);
    if(isLand){sw=sh0;sh=sw0;}
    const el=document.createElement('div');
    el.className='spot-marker';
    if(modifications[s.id])el.classList.add('modified');
    if(selectedSpots.has(s.id))el.classList.add('selected');
    el.dataset.id=s.id;
    el.style.left=pos.x+'px';el.style.top=pos.y+'px';
    if(showLabels){el.textContent=s.id;el.style.width=sw+'px';el.style.height=sh+'px';el.style.fontSize=Math.max(8,Math.min(11,Math.min(sw,sh)*0.35))+'px';el.style.padding='0 1px';el.style.borderRadius='2px';}
    else{el.textContent='';el.style.width=sw+'px';el.style.height=sh+'px';el.style.borderRadius='2px';}
    el.style.backgroundColor=colors[currentArea]+'66';
    el.style.border='1.5px solid '+colors[currentArea];
    el.addEventListener('mousedown',e=>startSpotDrag(e,s,el));
    canvas.appendChild(el);
  });
}

function startSpotDrag(e,spot,el){
  e.preventDefault();e.stopPropagation();
  const ctrl=e.ctrlKey||e.metaKey;
  const shift=e.shiftKey;

  if(ctrl){
    if(selectedSpots.has(spot.id))selectedSpots.delete(spot.id);else selectedSpots.add(spot.id);
    renderSpots();updateInfo();return;
  }
  if(shift&&selectedSpots.size>0){
    // Range select: find all spots between last selected and this one
    const areaSpots=allSpots.filter(s=>s.area[0]===currentArea);
    const lst=Array.from(selectedSpots);
    const lastId=lst[lst.length-1];
    const idx1=areaSpots.findIndex(s=>s.id===lastId);
    const idx2=areaSpots.findIndex(s=>s.id===spot.id);
    if(idx1>=0&&idx2>=0){
      const[lo,hi]=idx1<idx2?[idx1,idx2]:[idx2,idx1];
      for(let i=lo;i<=hi;i++)selectedSpots.add(areaSpots[i].id);
    }
    renderSpots();updateInfo();return;
  }

  // Single click: clear selection and select this
  if(!selectedSpots.has(spot.id)){selectedSpots.clear();selectedSpots.add(spot.id);}
  dragTargets=Array.from(selectedSpots).map(id=>allSpots.find(s=>s.id===id)).filter(Boolean);
  dragStarts=dragTargets.map(s=>({spot:s,pos:getSpotPos(s)}));
  el.classList.add('dragging');
  const zoom=1;
  const cr=document.getElementById('canvas').getBoundingClientRect();
  dragStart={x:(e.clientX-cr.left-panX*zoom)/zoom,y:(e.clientY-cr.top-panY*zoom)/zoom};
  renderSpots();updateInfo();
}

function onMouseDown(e){
  if(e.target.closest('.spot-marker'))return;
  if(!e.shiftKey){
    // Normal drag = box select
    boxSelecting=true;
    const cr=document.getElementById('canvas').getBoundingClientRect();
    boxStart={x:e.clientX-cr.left,y:e.clientY-cr.top};
    boxEl=document.createElement('div');
    boxEl.className='select-box';
    boxEl.style.left=boxStart.x+'px';boxEl.style.top=boxStart.y+'px';
    document.getElementById('canvas').appendChild(boxEl);
    return;
  }
  // Shift+drag = pan
  if(!e.ctrlKey&&!e.metaKey)selectedSpots.clear();
  panning=true;panStart={x:e.clientX-panX,y:e.clientY-panY};
  renderSpots();updateInfo();
}

function onMouseMove(e){
  if(dragTargets.length>0){
    e.preventDefault();
    const zoom=1;
    const cr=document.getElementById('canvas').getBoundingClientRect();
    const cx=(e.clientX-cr.left-panX*zoom)/zoom;
    const cy=(e.clientY-cr.top-panY*zoom)/zoom;
    const dx=cx-dragStart.x,dy=cy-dragStart.y;
    dragStarts.forEach(ds=>{
      const nx=ds.pos.x+dx,ny=ds.pos.y+dy;
      if(!modifications[ds.spot.id])modifications[ds.spot.id]={img_x:ds.spot.img_x,img_y:ds.spot.img_y};
      if(!undoStack[currentArea])undoStack[currentArea]=[];
      const last=undoStack[currentArea].length>0?undoStack[currentArea][undoStack[currentArea].length-1]:null;
      if(!last||last.spotId!==ds.spot.id||Math.abs(last.newX-nx)>2||Math.abs(last.newY-ny)>2){
        undoStack[currentArea].push({spotId:ds.spot.id,oldX:modifications[ds.spot.id].img_x,oldY:modifications[ds.spot.id].img_y,newX:nx,newY:ny});
        if(undoStack[currentArea].length>500)undoStack[currentArea].shift();
      }
      modifications[ds.spot.id].img_x=nx;modifications[ds.spot.id].img_y=ny;
      const m=document.querySelector(`.spot-marker[data-id="${ds.spot.id}"]`);
      if(m){m.style.left=nx+'px';m.style.top=ny+'px';m.classList.add('modified');}
    });
    hasModifications=true;updateInfo();updateStatus();return;
  }
  if(boxSelecting){
    const cr=document.getElementById('canvas').getBoundingClientRect();
    const cx=e.clientX-cr.left,cy=e.clientY-cr.top;
    const x=Math.min(boxStart.x,cx),y=Math.min(boxStart.y,cy);
    const w=Math.abs(cx-boxStart.x),h=Math.abs(cy-boxStart.y);
    boxEl.style.left=x+'px';boxEl.style.top=y+'px';
    boxEl.style.width=w+'px';boxEl.style.height=h+'px';return;
  }
  if(panning){
    panX=e.clientX-panStart.x;panY=e.clientY-panStart.y;
    document.getElementById('canvas').style.translate=`${panX}px ${panY}px`;
  }
}

function onMouseUp(e){
  if(boxSelecting){
    boxSelecting=false;
    if(boxEl){boxEl.remove();boxEl=null;}
    const cr=document.getElementById('canvas').getBoundingClientRect();
    const cx=e.clientX-cr.left,cy=e.clientY-cr.top;
    const x1=Math.min(boxStart.x,cx),y1=Math.min(boxStart.y,cy);
    const x2=Math.max(boxStart.x,cx),y2=Math.max(boxStart.y,cy);
    const areaSpots=allSpots.filter(s=>s.area[0]===currentArea);
    if(x2-x1<5&&y2-y1<5){if(boxEl){boxEl.remove();boxEl=null;}boxSelecting=false;return;}
    if(!e.ctrlKey)selectedSpots.clear();
    areaSpots.forEach(s=>{
      const p=getSpotPos(s);
      if(p.x>=x1&&p.x<=x2&&p.y>=y1&&p.y<=y2)selectedSpots.add(s.id);
    });
    renderSpots();updateInfo();return;
  }
  if(dragTargets.length>0){
    document.querySelectorAll('.spot-marker.dragging').forEach(m=>m.classList.remove('dragging'));
    dragTargets=[];dragStarts=[];
  }
  if(panning){panning=false;}
}

function onKey(e){
  if(selectedSpots.size===0||dragTargets.length>0)return;
  const step=e.shiftKey?10:1;
  let dx=0,dy=0;
  if(e.key==='ArrowLeft')dx=-step;else if(e.key==='ArrowRight')dx=step;
  else if(e.key==='ArrowUp')dy=-step;else if(e.key==='ArrowDown')dy=step;
  else return;
  e.preventDefault();
  if(!undoStack[currentArea])undoStack[currentArea]=[];
  for(const id of selectedSpots){
    const spot=allSpots.find(s=>s.id===id);if(!spot)continue;
    const pos=getSpotPos(spot);
    const nx=pos.x+dx,ny=pos.y+dy;
    if(!modifications[id])modifications[id]={img_x:spot.img_x,img_y:spot.img_y};
    undoStack[currentArea].push({spotId:id,oldX:modifications[id].img_x,oldY:modifications[id].img_y,newX:nx,newY:ny});
    if(undoStack[currentArea].length>500)undoStack[currentArea].shift();
    modifications[id].img_x=nx;modifications[id].img_y=ny;
    const m=document.querySelector(`.spot-marker[data-id="${id}"]`);
    if(m){m.style.left=nx+'px';m.style.top=ny+'px';m.classList.add('modified');}
  }
  hasModifications=true;updateInfo();updateStatus();
}

function selectRow(){
  if(selectedSpots.size===0)return;
  const first=Array.from(selectedSpots)[0];
  const spot=allSpots.find(s=>s.id===first);if(!spot)return;
  const pos=getSpotPos(spot);
  const areaSpots=allSpots.filter(s=>s.area[0]===currentArea);
  areaSpots.forEach(s=>{
    const p=getSpotPos(s);
    if(Math.abs(p.y-pos.y)<20)selectedSpots.add(s.id);
  });
  renderSpots();updateInfo();
}

function undo(){
  if(!undoStack[currentArea]||undoStack[currentArea].length===0)return;
  // Undo the last batch (all spots moved in last drag/key)
  const last=undoStack[currentArea][undoStack[currentArea].length-1];
  const batch=[];
  while(undoStack[currentArea].length>0){
    const a=undoStack[currentArea][undoStack[currentArea].length-1];
    if(a.newX===last.newX||Math.abs(a.newX-last.newX)<1){batch.unshift(undoStack[currentArea].pop());}
    else break;
    if(batch.length>300)break;
  }
  for(const a of batch){
    const spot=allSpots.find(s=>s.id===a.spotId);
    if(a.oldX===spot.img_x&&a.oldY===spot.img_y)delete modifications[a.spotId];
    else{if(!modifications[a.spotId])modifications[a.spotId]={img_x:a.oldX,img_y:a.oldY};modifications[a.spotId].img_x=a.oldX;modifications[a.spotId].img_y=a.oldY;}
  }
  renderSpots();
  hasModifications=Object.keys(modifications).length>0;
  updateStatus();updateInfo();
}

function resetSel(){if(!confirm('确认重置当前区域所有调整？'))return;const areaSpots=allSpots.filter(s=>s.area[0]===currentArea);areaSpots.forEach(s=>delete modifications[s.id]);undoStack[currentArea]=[];selectedSpots.clear();hasModifications=false;renderSpots();updateStatus();updateInfo();}

function saveToLocal(){areaSizes[currentArea]={w:parseInt(document.getElementById('spotW').value),h:parseInt(document.getElementById('spotH').value)};saveToLocalQuiet();updateStatus();const el=document.getElementById('status');el.innerHTML='<span class="status-dot saved"></span>已保存 ✅';setTimeout(updateStatus,1500);}
function saveToLocalQuiet(){localStorage.setItem('lanyuan_spot_adjustments',JSON.stringify(modifications));localStorage.setItem('lanyuan_spot_areaSizes',JSON.stringify(areaSizes));}

function exportJSON(){
  const final=allSpots.map(s=>modifications[s.id]?{...s,img_x:modifications[s.id].img_x,img_y:modifications[s.id].img_y,landscape:modifications[s.id].landscape||s.landscape}:{...s});
  const json=JSON.stringify(final,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='parking_spots_corrected.json';a.click();
  saveToLocalQuiet();updateStatus();
}



function onSizeChange(){renderSpots();}
function toggleLabels(){renderSpots();}

function updateInfo(){
  const el=document.getElementById('info');
  const areaSpots=allSpots.filter(s=>s.area[0]===currentArea);
  const modCount=areaSpots.filter(s=>modifications[s.id]).length;
  let html=`<b>${currentArea}区</b> | 车位:${areaSpots.length} | 已调:${modCount} | 选中:${selectedSpots.size}`;
  el.innerHTML=html;
}

function updateStatus(){
  const n=Object.keys(modifications).length;
  const el=document.getElementById('status');
  el.innerHTML=n>0?`<span class="status-dot modified"></span>${n} 处已调整`:'<span class="status-dot saved"></span>无调整';
}

function updateHelp(){
  document.getElementById('help').textContent=`${bgW?.toFixed(0)}×${bgH?.toFixed(0)} | 滚轮缩放 | 拖空白处框选 | Shift拖空白处平移 | Ctrl/Shift多选`;
}

init();
</script>
</body>
</html>
