<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>F区车位 - 最终确认</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#1a1a2e;color:#eee;overflow:hidden}
.header{background:#16213e;padding:8px 14px;display:flex;align-items:center;gap:12px;font-size:12px}
h1{font-size:15px}
.toolbar{display:flex;gap:8px;align-items:center;margin-left:auto;font-size:11px}
label{display:flex;align-items:center;gap:3px;cursor:pointer}
.viewport{position:relative;overflow:auto;height:calc(100vh - 48px)}
.canvas-wrap{position:relative;width:2957px;height:4828px}
.spot{position:absolute;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;color:#000;border-radius:2px;border:1.5px solid #a55eea;background:rgba(165,94,234,0.4);pointer-events:none}
.spot.landscape{background:rgba(165,94,234,0.5);border-color:#c39bff}
.info{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.85);padding:6px 12px;border-radius:6px;font-size:11px;pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="header">
<h1>🅿️ F区车位 — 最终确认</h1>
<div class="toolbar">
<label><input type="checkbox" id="showLabels" checked> 显示编号</label>
<span id="stats"></span>
</div>
</div>
<div class="viewport">
<div class="canvas-wrap" id="canvas"></div>
<div class="info" id="info"></div>
</div>
<script>
async function init(){
  const resp = await fetch('parking_spots_corrected_F.json');
  const spots = (await resp.json()).filter(s => s.area && s.area[0] === 'F');
  
  const canvas = document.getElementById('canvas');
  const img = document.createElement('img');
  img.src = 'F_bg_combined.png';
  img.style.width = '2957px';
  img.style.height = '4828px';
  img.draggable = false;
  canvas.appendChild(img);
  
  const rw = spots[0]?.rect_w || 41;
  const rh = spots[0]?.rect_h || 41;
  let lc=0;
  
  spots.forEach(s => {
    const isLand = s.landscape;
    const sw = isLand ? rh : rw;
    const sh = isLand ? rw : rh;
    if(isLand) lc++;
    
    const el = document.createElement('div');
    el.className = 'spot' + (isLand ? ' landscape' : '');
    el.style.left = s.img_x + 'px';
    el.style.top = s.img_y + 'px';
    el.style.width = sw + 'px';
    el.style.height = sh + 'px';
    el.style.fontSize = Math.max(8, Math.min(11, Math.min(sw,sh)*0.35)) + 'px';
    if(document.getElementById('showLabels').checked) el.textContent = s.id;
    canvas.appendChild(el);
  });
  
  document.getElementById('stats').textContent = `${spots.length} 个 | 横向: ${lc}`;
  document.getElementById('info').textContent = `F区 ${spots.length}个 | 框 ${rw.toFixed(0)}×${rh.toFixed(0)}`;
  document.getElementById('showLabels').onchange = function(){
    document.querySelectorAll('.spot').forEach(el => {
      el.textContent = this.checked ? (el.dataset.id || '') : '';
    });
  };
}
init();
</script>
</body>
</html>
