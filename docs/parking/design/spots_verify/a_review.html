<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>A区车位 - 最终确认</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#1a1a2e;color:#eee;overflow:hidden}
.header{background:#16213e;padding:8px 14px;display:flex;align-items:center;gap:12px;font-size:12px}
h1{font-size:15px}
.toolbar{display:flex;gap:8px;align-items:center;margin-left:auto;font-size:11px}
label{display:flex;align-items:center;gap:3px;cursor:pointer}
.viewport{position:relative;overflow:auto;height:calc(100vh - 48px)}
.canvas-wrap{position:relative;width:2670px;height:1339px}
.canvas-wrap img{display:block;position:absolute;top:0;left:0}
.spot{position:absolute;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;color:#000;border-radius:2px;border:1.5px solid #e94560;background:rgba(233,69,96,0.4);pointer-events:none}
.spot.landscape{background:rgba(233,69,96,0.5);border-color:#ff6b81}
.info{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.85);padding:6px 12px;border-radius:6px;font-size:11px;pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="header">
<h1>🅿️ A区车位 — 最终确认</h1>
<div class="toolbar">
<label><input type="checkbox" id="showLabels" checked> 显示编号</label>
<span id="stats"></span>
</div>
</div>
<div class="viewport">
<div class="canvas-wrap" id="canvas"></div>
<div class="info" id="info"></div>
</div>
<script>
async function init(){
  const resp = await fetch('parking_spots_corrected_A.json');
  const spots = (await resp.json()).filter(s => s.area && s.area[0] === 'A');
  
  const canvas = document.getElementById('canvas');
  
  // Same bg image setup as adjust.html
  const img = document.createElement('img');
  img.src = 'A_bg_2566072e.png';
  img.style.width = '2670px';
  img.style.height = '1339px';
  img.draggable = false;
  canvas.appendChild(img);
  
  let landscapeCount = 0;
  
  spots.forEach(s => {
    const rw = spots[0]?.rect_w || 30;
    const rh = spots[0]?.rect_h || 65;
    const isLand = s.landscape;
    const sw = isLand ? rh : rw;
    const sh = isLand ? rw : rh;
    const x = s.img_x;
    const y = s.img_y;
    
    if(isLand) landscapeCount++;
    
    const el = document.createElement('div');
    el.className = 'spot' + (isLand ? ' landscape' : '');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = sw + 'px';
    el.style.height = sh + 'px';
    el.style.fontSize = Math.max(8, Math.min(11, Math.min(sw,sh)*0.35)) + 'px';
    if(document.getElementById('showLabels').checked) el.textContent = s.id;
    canvas.appendChild(el);
  });
  
  document.getElementById('stats').textContent = `${spots.length} 个车位 | 横向: ${landscapeCount}`;
  document.getElementById('info').textContent = `A区 ${spots.length}个 | 框 30×65 | 横向 ${landscapeCount}个`;
  
  document.getElementById('showLabels').onchange = function(){
    document.querySelectorAll('.spot').forEach(el => {
      el.textContent = this.checked ? el.textContent || el.dataset.id || '' : '';
    });
  };
}

init();
</script>
</body>
</html>
