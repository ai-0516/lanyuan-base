<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布帖子 · 兰园</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#e8e8e8;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.phone{width:375px;height:812px;background:#f5f5f5;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.12);display:flex;flex-direction:column}
.status-bar{height:44px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600;flex-shrink:0;color:#1a1a1a}
.nav-bar{height:44px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:17px;font-weight:600;flex-shrink:0}
.nav-bar .cancel{font-size:15px;color:#999;cursor:pointer;text-decoration:none}
.nav-bar .title{font-weight:600}
.nav-bar .publish{font-size:15px;color:#07C160;font-weight:600;cursor:pointer;background:none;border:none;padding:4px 12px;border-radius:16px;transition:background 0.2s}
.nav-bar .publish:hover{background:#E8F8EE}
.nav-bar .publish:disabled{color:#ccc;cursor:not-allowed}
.page-content{flex:1;overflow-y:auto;background:#fff;padding:16px}
.textarea{width:100%;min-height:200px;border:none;outline:none;font-size:16px;line-height:1.6;font-family:inherit;resize:none;color:#333}
.textarea::placeholder{color:#ccc}
.image-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.img-box{width:80px;height:80px;border-radius:8px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:background 0.2s;position:relative}
.img-box:hover{background:#eee}
.img-box.add{border:1.5px dashed #ddd}
.img-box .remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#FF3B30;color:#fff;font-size:12px;display:none;align-items:center;justify-content:center;cursor:pointer}
.img-box.filled .remove{display:flex}
.img-box.filled{background:linear-gradient(135deg,#a8edea,#fed6e3)}
.img-box.filled.i2{background:linear-gradient(135deg,#d4fc79,#96e6a1)}
.char-count{text-align:right;font-size:12px;color:#ccc;margin-top:8px}
.char-count.warn{color:#FF9500}
.char-count.over{color:#FF3B30}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;display:none;z-index:100}
.toast.show{display:block;animation:fadeInOut 2s ease}
@keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.home-indicator{height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.home-indicator .bar{width:134px;height:5px;background:#333;border-radius:3px}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <svg width="66" height="12" viewBox="0 0 66 12"><rect x="0" y="0" width="18" height="12" rx="2" fill="#1a1a1a"/><rect x="20" y="2" width="18" height="8" rx="2" fill="#1a1a1a"/><rect x="40" y="4" width="18" height="4" rx="2" fill="#1a1a1a"/><rect x="60" y="1" width="4" height="10" rx="1" fill="#1a1a1a"/></svg>
  </div>
  <div class="nav-bar">
    <a href="05-social-feed.html" class="cancel">取消</a>
    <span class="title">发布帖子</span>
    <button class="publish" onclick="publishPost()">发布</button>
  </div>

  <div class="page-content">
    <textarea class="textarea" placeholder="分享小区新鲜事..." id="postText" maxlength="500" oninput="updateCount()"></textarea>
    <div class="char-count" id="charCount">0/500</div>
    <div class="image-grid" id="imageGrid">
      <div class="img-box add" onclick="addImage()">📷</div>
    </div>
  </div>

  <div class="toast" id="toast">✅ 发布成功</div>
  <div class="home-indicator"><div class="bar"></div></div>
</div>

<script>
var imgCount = 0;
function updateCount() {
  var t = document.getElementById('postText');
  var c = document.getElementById('charCount');
  var len = t.value.length;
  c.textContent = len + '/500';
  c.className = 'char-count';
  if (len > 400) c.classList.add('warn');
  if (len >= 500) c.classList.add('over');
}
function addImage() {
  if (imgCount >= 3) return;
  imgCount++;
  var grid = document.getElementById('imageGrid');
  var box = document.createElement('div');
  box.className = 'img-box filled' + (imgCount > 1 ? ' i2' : '');
  box.innerHTML = '<span>🖼️</span><div class="remove" onclick="removeImage(this)">✕</div>';
  grid.insertBefore(box, grid.lastElementChild);
  if (imgCount >= 3) {
    grid.lastElementChild.style.display = 'none';
  }
}
function removeImage(el) {
  el.parentElement.remove();
  imgCount--;
  var addBtn = document.getElementById('imageGrid').lastElementChild;
  addBtn.style.display = 'flex';
}
function publishPost() {
  var text = document.getElementById('postText').value.trim();
  if (!text && imgCount === 0) return;
  var toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(function() {
    toast.classList.remove('show');
    window.location.href = '05-social-feed.html';
  }, 1500);
}
</script>
</body>
</html>
