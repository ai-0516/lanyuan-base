<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对话历史 · 兰园</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --cream:#faf7f2;--warm-white:#fffaf5;--terracotta:#c4673c;--terracotta-deep:#9b3d1a;
    --terracotta-light:#e8a87c;--ember:#d4744b;--clay:#b8532e;--sand:#f2e8dc;
    --sand-dark:#e8d5c0;--bark:#3d2b1f;
    --shadow-sm:0 1px 3px rgba(61,43,31,0.06),0 1px 2px rgba(61,43,31,0.04);
    --shadow-md:0 4px 16px rgba(61,43,31,0.07),0 2px 6px rgba(61,43,31,0.04);
    --shadow-lg:0 12px 32px rgba(61,43,31,0.1),0 4px 12px rgba(61,43,31,0.05);
  }
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;
    background:#ede4d8;font-family:'DM Sans',-apple-system,sans-serif;
    background-image:radial-gradient(ellipse at 20% 50%,rgba(212,116,75,0.08) 0%,transparent 50%),
      radial-gradient(ellipse at 80% 20%,rgba(200,150,62,0.06) 0%,transparent 50%);}
  .phone{width:390px;height:760px;background:var(--cream);border-radius:36px;display:flex;flex-direction:column;
    box-shadow:0 0 0 1px rgba(61,43,31,0.08),0 24px 64px rgba(61,43,31,0.15),0 8px 24px rgba(61,43,31,0.1);overflow:hidden;position:relative}
  .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 0;font-size:11px;font-weight:500;color:var(--bark)}
  .nav-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px}
  .nav-bar .back{font-size:14px;color:var(--terracotta);cursor:pointer;text-decoration:none;font-weight:500}
  .nav-bar .title{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--bark)}
  .nav-bar .edit-btn{font-size:12px;color:var(--terracotta);cursor:pointer;border:none;background:none;font-weight:500;font-family:'DM Sans',sans-serif}
  .nav-bar .done-btn{font-size:12px;color:var(--terracotta);font-weight:600;cursor:pointer;border:none;background:none;display:none;font-family:'DM Sans',sans-serif}
  .page-content{flex:1;overflow-y:auto;padding:0 16px 8px}
  .history-list{background:var(--warm-white);border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow-sm);border:1px solid rgba(232,213,192,0.4)}
  .conv-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(232,213,192,0.3);
    cursor:pointer;transition:all 0.2s;gap:10px}
  .conv-item:last-child{border-bottom:none}
  .conv-item:active{background:rgba(196,103,60,0.04)}
  .conv-check{display:none;width:22px;height:22px;border-radius:50%;border:2px solid #d8c8b8;margin-right:2px;
    flex-shrink:0;align-items:center;justify-content:center;transition:all 0.2s}
  .conv-check svg{width:12px;height:12px;color:#fff;display:none}
  .conv-check.checked{background:var(--terracotta);border-color:var(--terracotta)}
  .conv-check.checked svg{display:block}
  .conv-icon{width:38px;height:38px;border-radius:12px;
    background:linear-gradient(135deg,var(--terracotta-light),var(--terracotta));
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .conv-icon svg{width:18px;height:18px;color:#fff}
  .conv-body{flex:1;min-width:0}
  .conv-title{font-size:13px;font-weight:600;color:var(--bark);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-preview{font-size:11px;color:#b8a898;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-time{font-size:10px;color:#d8c8b8;flex-shrink:0}
  .edit-mode .conv-item{cursor:default}
  .edit-mode .conv-item:active{background:transparent}
  .edit-mode .conv-check{display:flex}
  .edit-mode .conv-item.selected{background:rgba(196,103,60,0.04)}
  .edit-mode .nav-bar .edit-btn{display:none}
  .edit-mode .nav-bar .done-btn{display:block}
  .batch-bar{display:none;align-items:center;justify-content:space-between;padding:10px 16px;
    background:var(--warm-white);border-top:1px solid rgba(232,213,192,0.4);flex-shrink:0}
  .batch-bar.show{display:flex}
  .batch-delete{color:var(--terracotta);font-size:13px;cursor:pointer;padding:6px 14px;border-radius:8px;
    transition:background 0.15s;font-weight:500;display:flex;align-items:center;gap:4px}
  .batch-delete:hover{background:rgba(196,103,60,0.06)}
  .batch-delete svg{width:14px;height:14px}
  .batch-count{font-size:13px;color:var(--bark)}
  .modal-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(61,43,31,0.4);
    display:none;align-items:center;justify-content:center;z-index:50}
  .modal-overlay.show{display:flex}
  .modal-dialog{width:280px;background:var(--warm-white);border-radius:16px;padding:24px;
    text-align:center;box-shadow:var(--shadow-lg)}
  .modal-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--bark);margin-bottom:16px}
  .modal-input{width:100%;padding:10px 14px;border:1.5px solid rgba(232,213,192,0.5);border-radius:10px;
    font-size:14px;outline:none;font-family:'DM Sans',sans-serif;margin-bottom:16px;transition:border-color 0.2s;color:var(--bark)}
  .modal-input:focus{border-color:var(--terracotta-light)}
  .modal-buttons{display:flex;gap:10px}
  .modal-btn{flex:1;padding:10px;border-radius:10px;font-size:14px;cursor:pointer;border:none;transition:all 0.15s;font-weight:500;font-family:'DM Sans',sans-serif}
  .modal-btn.cancel{background:var(--cream);color:var(--bark)}
  .modal-btn.cancel:hover{background:var(--sand)}
  .modal-btn.confirm{background:linear-gradient(135deg,var(--ember),var(--clay));color:#fff}
  .modal-btn.confirm:active{transform:scale(0.97)}
  .home-indicator{height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .home-indicator .bar{width:134px;height:5px;background:var(--bark);border-radius:3px;opacity:0.15}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .s1{animation:fadeIn 0.3s ease both}.s2{animation:fadeIn 0.3s 0.05s ease both}.s3{animation:fadeIn 0.3s 0.1s ease both}
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar"><span>9:41</span><span style="font-size:12px;opacity:0.5">●●● WiFi</span></div>
  <div class="nav-bar">
    <a href="v3-ai-chat.html" class="back">‹ 返回</a>
    <span class="title">对话历史</span>
    <button class="edit-btn" onclick="toggleEdit()">管理</button>
    <button class="done-btn" onclick="toggleEdit()">完成</button>
  </div>

  <div class="page-content" id="convList">
    <div class="history-list s1">
      <div class="conv-item" id="conv1" onclick="openConv(this, event)">
        <div class="conv-check" onclick="event.stopPropagation();toggleCheck(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="conv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div>
        <div class="conv-body">
          <div class="conv-title">小区物业电话咨询</div>
          <div class="conv-preview">兰园小区物业服务中心 ☎️ 010-8888-6666…</div>
        </div>
        <span class="conv-time">昨天</span>
      </div>
      <div class="conv-item s2" id="conv2" onclick="openConv(this, event)">
        <div class="conv-check" onclick="event.stopPropagation();toggleCheck(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="conv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div>
        <div class="conv-body">
          <div class="conv-title">周末去哪玩推荐</div>
          <div class="conv-preview">北京周末好去处 🌿 奥林匹克森林公园、798…</div>
        </div>
        <span class="conv-time">3天前</span>
      </div>
      <div class="conv-item s3" id="conv3" onclick="openConv(this, event)">
        <div class="conv-check" onclick="event.stopPropagation();toggleCheck(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="conv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div>
        <div class="conv-body">
          <div class="conv-title">周边美食推荐</div>
          <div class="conv-preview">小区周边美食推荐 🍜 老北京炸酱面、蜀九香…</div>
        </div>
        <span class="conv-time">1周前</span>
      </div>
    </div>
  </div>

  <div class="batch-bar" id="batchBar">
    <span class="batch-count" id="batchCount">已选择 0 项</span>
    <span class="batch-delete" onclick="batchDelete()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      删除
    </span>
  </div>

  <div class="modal-overlay" id="renameModal">
    <div class="modal-dialog">
      <div class="modal-title">重命名</div>
      <input class="modal-input" id="renameInput" placeholder="输入新名称">
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="hideRename()">取消</button>
        <button class="modal-btn confirm" onclick="doRename()">确定</button>
      </div>
    </div>
  </div>
  <div class="home-indicator"><div class="bar"></div></div>
</div>

<script>
var editMode = false;
function toggleEdit() {
  editMode = !editMode;
  var list = document.getElementById('convList');
  var batchBar = document.getElementById('batchBar');
  if (editMode) {
    list.classList.add('edit-mode');
    list.querySelectorAll('.conv-check.checked').forEach(function(c){c.classList.remove('checked');});
    updateBatchCount();
  } else {
    list.classList.remove('edit-mode');
    batchBar.classList.remove('show');
    list.querySelectorAll('.conv-item').forEach(function(i){i.classList.remove('selected');});
    list.querySelectorAll('.conv-check').forEach(function(c){c.classList.remove('checked');});
  }
}
function toggleCheck(check) {
  if (!editMode) return;
  check.classList.toggle('checked');
  check.closest('.conv-item').classList.toggle('selected');
  updateBatchCount();
}
function updateBatchCount() {
  var count = document.querySelectorAll('.conv-check.checked').length;
  var batchBar = document.getElementById('batchBar');
  document.getElementById('batchCount').textContent = '已选择 ' + count + ' 项';
  if (count > 0) batchBar.classList.add('show');
  else batchBar.classList.remove('show');
}
function openConv(item, event) {
  if (editMode) { toggleCheck(item.querySelector('.conv-check')); return; }
  window.location.href = 'v3-ai-chat.html';
}
function showRename(id) {
  document.getElementById('renameInput').value = document.getElementById(id).querySelector('.conv-title').textContent;
  document.getElementById('renameModal').classList.add('show');
}
function hideRename() { document.getElementById('renameModal').classList.remove('show'); }
function doRename() {
  console.log('rename');
  hideRename();
}
function batchDelete() {
  var items = document.querySelectorAll('.conv-check.checked');
  items.forEach(function(c){
    var item = c.closest('.conv-item');
    item.style.opacity = '0'; item.style.transform = 'translateX(-120%)'; item.style.transition = 'all 0.3s';
    setTimeout(function(){ item.remove(); }, 300);
  });
  toggleEdit();
}
</script>
</body>
</html>
