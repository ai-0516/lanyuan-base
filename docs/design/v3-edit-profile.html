<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑资料 · 兰园</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --cream:#faf7f2;--warm-white:#fffaf5;--terracotta:#c4673c;--terracotta-deep:#9b3d1a;
    --terracotta-light:#e8a87c;--ember:#d4744b;--clay:#b8532e;--sand:#f2e8dc;
    --sand-dark:#e8d5c0;--bark:#3d2b1f;
    --shadow-sm:0 1px 3px rgba(61,43,31,0.06),0 1px 2px rgba(61,43,31,0.04);
    --shadow-md:0 4px 16px rgba(61,43,31,0.07),0 2px 6px rgba(61,43,31,0.04);
    --shadow-lg:0 12px 32px rgba(61,43,31,0.1),0 4px 12px rgba(61,43,31,0.05);
  }
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;
    background:#ede4d8;font-family:'DM Sans',-apple-system,sans-serif;
    background-image:radial-gradient(ellipse at 20% 50%,rgba(212,116,75,0.08) 0%,transparent 50%),
      radial-gradient(ellipse at 80% 20%,rgba(200,150,62,0.06) 0%,transparent 50%);}
  .phone{width:390px;height:760px;background:var(--cream);border-radius:36px;display:flex;flex-direction:column;
    box-shadow:0 0 0 1px rgba(61,43,31,0.08),0 24px 64px rgba(61,43,31,0.15),0 8px 24px rgba(61,43,31,0.1);overflow:hidden;position:relative}
  .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 0;font-size:11px;font-weight:500;color:var(--bark)}
  .nav-bar{display:flex;align-items:center;padding:6px 16px 10px;position:relative}
  .nav-bar .back{position:absolute;left:16px;font-size:14px;color:var(--terracotta);cursor:pointer;text-decoration:none;font-weight:500}
  .nav-bar .title{flex:1;text-align:center;font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--bark)}
  .page-content{flex:1;padding:0 16px 8px}
  .section{background:var(--warm-white);border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid rgba(232,213,192,0.4);overflow:hidden}
  .section-title{font-size:11px;color:#b8a898;padding:12px 4px 6px;letter-spacing:0.5px;text-transform:uppercase;font-weight:500}
  .field{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(232,213,192,0.3);transition:background 0.15s}
  .field:last-child{border-bottom:none}
  .field:active{background:rgba(196,103,60,0.04)}
  .field-label{font-size:14px;color:var(--bark);font-weight:500}
  .field-value{font-size:13px;color:#b8a898;display:flex;align-items:center;gap:6px}
  .avatar-sm{width:44px;height:44px;border-radius:14px;
    background:linear-gradient(135deg,var(--terracotta-light),var(--terracotta));
    display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
  input,textarea{font-size:14px;color:var(--bark);border:none;text-align:right;outline:none;
    background:transparent;width:180px;font-family:'DM Sans',sans-serif}
  textarea{resize:none;height:24px;line-height:24px}
  .save-bar{padding:12px 0 8px}
  .save-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--ember),var(--clay));
    color:#fff;border:none;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;
    transition:transform 0.2s,box-shadow 0.2s;box-shadow:var(--shadow-md)}
  .save-btn:hover{box-shadow:var(--shadow-lg)}
  .save-btn:active{transform:scale(0.97)}
  .toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(61,43,31,0.85);
    color:#fff;padding:12px 24px;border-radius:12px;font-size:13px;display:none;z-index:100;
    backdrop-filter:blur(4px)}
  .toast.show{display:block;animation:fadeInOut 2s ease}
  @keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,-50%) scale(0.85)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
  .home-indicator{height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .home-indicator .bar{width:134px;height:5px;background:var(--bark);border-radius:3px;opacity:0.15}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .s1{animation:fadeIn 0.3s ease both}.s2{animation:fadeIn 0.3s 0.05s ease both}.s3{animation:fadeIn 0.3s 0.1s ease both}
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar"><span>9:41</span><span style="font-size:12px;opacity:0.5">●●● WiFi</span></div>
  <div class="nav-bar">
    <a href="v3-profile.html" class="back">‹ 返回</a>
    <span class="title">编辑资料</span>
  </div>

  <div class="page-content">
    <div class="section s1">
      <div class="field">
        <span class="field-label">头像</span>
        <div class="field-value"><div class="avatar-sm">👤</div> ›</div>
      </div>
      <div class="field">
        <span class="field-label">昵称</span>
        <div class="field-value"><span>兰园业主</span> ›</div>
      </div>
    </div>

    <div class="section-title s2">社区信息</div>
    <div class="section s2">
      <div class="field">
        <span class="field-label">楼号</span>
        <div class="field-value"><input type="text" value="3号楼" placeholder="请选择"></div>
      </div>
      <div class="field">
        <span class="field-label">单元</span>
        <div class="field-value"><input type="text" value="2单元" placeholder="请选择"></div>
      </div>
      <div class="field">
        <span class="field-label">房号</span>
        <div class="field-value"><input type="text" value="1201" placeholder="请输入房号"></div>
      </div>
    </div>

    <div class="section-title s3">其他信息</div>
    <div class="section s3">
      <div class="field">
        <span class="field-label">个性签名</span>
        <div class="field-value"><textarea placeholder="介绍一下自己吧" rows="1">热爱生活的小区业主 🌿</textarea></div>
      </div>
    </div>

    <div class="save-bar"><button class="save-btn" onclick="saveProfile()">保存</button></div>
    <div style="height:8px"></div>
  </div>

  <div class="toast" id="toast">✅ 保存成功</div>
  <div class="home-indicator"><div class="bar"></div></div>
</div>

<script>
function saveProfile() {
  var t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2000);
}
</script>
</body>
</html>
