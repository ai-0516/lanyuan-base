<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消息通知 · 兰园</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --cream:#faf7f2;--warm-white:#fffaf5;--terracotta:#c4673c;--terracotta-deep:#9b3d1a;
    --terracotta-light:#e8a87c;--ember:#d4744b;--clay:#b8532e;--sand:#f2e8dc;
    --sand-dark:#e8d5c0;--bark:#3d2b1f;
    --shadow-sm:0 1px 3px rgba(61,43,31,0.06),0 1px 2px rgba(61,43,31,0.04);
    --shadow-md:0 4px 16px rgba(61,43,31,0.07),0 2px 6px rgba(61,43,31,0.04);
    --shadow-lg:0 12px 32px rgba(61,43,31,0.1),0 4px 12px rgba(61,43,31,0.05);
  }
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;
    background:#ede4d8;font-family:'DM Sans',-apple-system,sans-serif;
    background-image:radial-gradient(ellipse at 20% 50%,rgba(212,116,75,0.08) 0%,transparent 50%),
      radial-gradient(ellipse at 80% 20%,rgba(200,150,62,0.06) 0%,transparent 50%);}
  .phone{width:390px;height:760px;background:var(--cream);border-radius:36px;
    display:flex;flex-direction:column;
    box-shadow:0 0 0 1px rgba(61,43,31,0.08),0 24px 64px rgba(61,43,31,0.15),0 8px 24px rgba(61,43,31,0.1);
    overflow:hidden;position:relative}
  .status-bar{display:flex;justify-content:space-between;align-items:center;
    padding:12px 24px 0;font-size:11px;font-weight:500;color:var(--bark)}
  .nav-bar{display:flex;align-items:center;padding:6px 16px 10px;position:relative}
  .nav-bar .back{position:absolute;left:16px;font-size:14px;color:var(--terracotta);cursor:pointer;text-decoration:none;font-weight:500}
  .nav-bar .title{flex:1;text-align:center;font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--bark)}
  .page-content{flex:1;padding:0 0 8px;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
  .page-content::-webkit-scrollbar{display:none}

  /* Notification list */
  .notif-list{background:var(--warm-white);border-radius:16px;margin:12px 16px;box-shadow:var(--shadow-sm);border:1px solid rgba(232,213,192,0.4);overflow:hidden}
  .notif-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(232,213,192,0.25);cursor:pointer;transition:background 0.15s;text-decoration:none;color:inherit}
  .notif-item:last-child{border-bottom:none}
  .notif-item:active{background:rgba(196,103,60,0.04)}
  .notif-item.unread{background:rgba(196,103,60,0.03)}
  .notif-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;overflow:hidden;position:relative}
  .notif-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .notif-avatar .action-badge{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;border:2px solid var(--warm-white)}
  .action-badge.like{background:linear-gradient(135deg,#fce4d6,#f5cba0);color:#c4673c}
  .action-badge.comment{background:linear-gradient(135deg,#d6eaf8,#aed6f1);color:#5b7fa5}
  .notif-body{flex:1;min-width:0}
  .notif-name{font-size:13px;font-weight:600;color:var(--terracotta)}
  .notif-action{font-size:13px;color:var(--bark)}
  .notif-post{font-size:12px;color:#b8a898;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .notif-post::before{content:"「"}
  .notif-post::after{content:"」"}
  .notif-time{font-size:11px;color:#c8b8a8;flex-shrink:0}
  .notif-dot{width:7px;height:7px;border-radius:50%;background:var(--terracotta);flex-shrink:0;margin-left:4px}

  /* Empty state */
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:#d8c8b8}
  .empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:0.5}
  .empty-state p{font-size:14px;color:#c8b8a8}

  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .s1{animation:fadeIn 0.4s ease both}.s2{animation:fadeIn 0.4s 0.06s ease both}.s3{animation:fadeIn 0.4s 0.12s ease both}
</style>
</head>
<body>

<div class="phone">

  <div class="nav-bar">

    <div style="flex:1;text-align:center;padding:6px 0;cursor:pointer;font-size:10px;font-weight:500;color:#c8b8a8;position:relative">
      <span style="display:block;margin-bottom:3px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;display:block;margin:0 auto"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>AI
    </div>
    <a href="v3-social-feed.html" style="flex:1;text-align:center;padding:6px 0;cursor:pointer;font-size:10px;font-weight:500;color:#c8b8a8;transition:all 0.25s;position:relative;text-decoration:none">
      <span style="display:block;margin-bottom:3px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:20px;height:20px;display:block;margin:0 auto"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>发现

    <a href="v3-profile.html" style="flex:1;text-align:center;padding:6px 0;cursor:pointer;font-size:10px;font-weight:500;color:#c8b8a8;transition:all 0.25s;position:relative;text-decoration:none">
      <span style="display:block;margin-bottom:3px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:20px;height:20px;display:block;margin:0 auto"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>我

  <div class="home-indicator" style="height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><div style="width:134px;height:5px;background:var(--bark);border-radius:3px;opacity:0.15"></div></div>
