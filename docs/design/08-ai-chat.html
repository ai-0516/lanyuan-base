<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 助手 · 兰园</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#e8e8e8;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.phone{width:375px;height:812px;background:#ededed;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 8px 40px rgba(0,0,0,0.15);display:flex;flex-direction:column}
.status-bar{height:44px;background:#ededed;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:600;flex-shrink:0}
.nav-bar{height:44px;background:#ededed;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;flex-shrink:0;position:relative}
.nav-bar .history-btn{position:absolute;right:16px;font-size:14px;color:#07C160;cursor:pointer;text-decoration:none;padding:4px 8px}
.page-content{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:16px}

/* Welcome */
.welcome{text-align:center;margin-top:40px}
.welcome-icon{font-size:56px;margin-bottom:12px}
.welcome-title{font-size:18px;font-weight:600;color:#333;margin-bottom:4px}
.welcome-sub{font-size:13px;color:#999;margin-bottom:20px}
.quick-prompts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.quick-prompt{padding:8px 14px;background:#fff;border:1px solid #e0e0e0;border-radius:16px;font-size:13px;color:#666;cursor:pointer;transition:all 0.2s}
.quick-prompt:hover{background:#E8F8EE;border-color:#07C160;color:#07C160}

/* Chat bubbles */
.msg{display:flex;gap:8px;animation:msgIn 0.3s ease}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.msg-avatar.user{background:#E8F8EE}
.msg-avatar.ai{background:#E8F0FE}
.bubble{max-width:75%;padding:10px 14px;font-size:15px;line-height:1.5;word-break:break-word}
.bubble.user{background:#95EC69;color:#333;border-radius:18px 4px 18px 18px}
.bubble.ai{background:#fff;color:#333;border-radius:4px 18px 18px 18px;box-shadow:0 1px 2px rgba(0,0,0,0.05)}
.msg-time{font-size:11px;color:#bbb;text-align:center;margin:8px 0}

/* Typing indicator */
.typing{display:none;align-items:center;gap:8px;padding:0 0 0 44px}
.typing .dots{display:flex;gap:4px;padding:12px 14px;background:#fff;border-radius:18px}
.typing .dots span{width:8px;height:8px;border-radius:50%;background:#ccc;animation:typingDot 1.4s infinite}
.typing .dots span:nth-child(2){animation-delay:0.2s}
.typing .dots span:nth-child(3){animation-delay:0.4s}
@keyframes typingDot{0%,60%,100%{opacity:0.3;transform:scale(1)}30%{opacity:1;transform:scale(1.2)}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Input bar */
.input-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#f5f5f5;border-top:1px solid #e0e0e0;flex-shrink:0}
.input-bar input{flex:1;padding:10px 16px;background:#fff;border:none;border-radius:20px;font-size:15px;outline:none;font-family:inherit}
.input-bar input:focus{box-shadow:0 0 0 2px rgba(7,193,96,0.2)}
.send-btn{width:36px;height:36px;border-radius:50%;background:#07C160;color:#fff;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.send-btn:hover{background:#06AD56}
.send-btn:disabled{background:#ccc;cursor:not-allowed}

/* Tab bar */
.tab-bar{height:56px;background:#fff;border-top:1px solid #e8e8e8;display:flex;align-items:center;flex-shrink:0;padding-bottom:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#999;font-size:10px;gap:2px;text-decoration:none}
.tab.active{color:#07C160}
.tab .tab-icon{font-size:22px}
.home-indicator{height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.home-indicator .bar{width:134px;height:5px;background:#333;border-radius:3px}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span class="time">9:41</span><span>📶 🔋</span></div>
  <div class="nav-bar">
    <span>AI 助手</span>
    <a href="09-ai-history.html" class="history-btn">历史</a>
  </div>

  <div class="page-content" id="chatArea">
    <!-- Welcome -->
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🤖</div>
      <div class="welcome-title">你好，我是兰园 AI 助手</div>
      <div class="welcome-sub">基于 DeepSeek，随时为你解答问题</div>
      <div class="quick-prompts">
        <span class="quick-prompt" onclick="sendQuick(this)">小区物业电话多少？</span>
        <span class="quick-prompt" onclick="sendQuick(this)">如何缴纳地暖费？</span>
        <span class="quick-prompt" onclick="sendQuick(this)">周边有什么好吃的？</span>
        <span class="quick-prompt" onclick="sendQuick(this)">推荐一个周末去处</span>
      </div>
    </div>
  </div>

  <!-- Typing -->
  <div class="typing" id="typing">
    <div class="msg-avatar ai">🤖</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

  <!-- Input -->
  <div class="input-bar">
    <input type="text" id="msgInput" placeholder="输入消息..." oninput="updateSend()" onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="send-btn" id="sendBtn" disabled onclick="sendMsg()">↑</button>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <a href="02-profile.html" class="tab">
      <span class="tab-icon">👤</span><span>我的</span>
    </a>
    <a href="05-social-feed.html" class="tab">
      <span class="tab-icon">💬</span><span>社交</span>
    </a>
    <a href="08-ai-chat.html" class="tab active">
      <span class="tab-icon">🤖</span><span>AI</span>
    </a>
  </div>
  <div class="home-indicator"><div class="bar"></div></div>
</div>

<script>
function updateSend() {
  var btn = document.getElementById('sendBtn');
  btn.disabled = document.getElementById('msgInput').value.trim() === '';
}
function sendQuick(el) {
  document.getElementById('msgInput').value = el.textContent;
  updateSend();
  sendMsg();
}
function sendMsg() {
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  updateSend();

  // Hide welcome
  var welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';

  // Add user message
  var timeDiv = document.createElement('div');
  timeDiv.className = 'msg-time';
  timeDiv.textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('chatArea').appendChild(timeDiv);

  var userDiv = document.createElement('div');
  userDiv.className = 'msg user';
  userDiv.innerHTML = '<div class="msg-avatar user">👤</div><div class="bubble user">' + text + '</div>';
  document.getElementById('chatArea').appendChild(userDiv);

  // Show typing
  var typing = document.getElementById('typing');
  typing.style.display = 'flex';
  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;

  // Simulate AI response
  setTimeout(function() {
    typing.style.display = 'none';
    var resp = getAIResponse(text);
    var aiDiv = document.createElement('div');
    aiDiv.className = 'msg';
    aiDiv.innerHTML = '<div class="msg-avatar ai">🤖</div><div class="bubble ai">' + resp + '</div>';
    document.getElementById('chatArea').appendChild(aiDiv);
    document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
  }, 1500 + Math.random() * 1500);
}
function getAIResponse(text) {
  var responses = {
    '小区物业电话多少？': '兰园小区物业服务中心 ☎️ 010-8888-6666\n\n办公时间：周一至周五 8:30-17:30\n周末及节假日：9:00-16:00\n\n紧急情况可拨打 24 小时值班电话：010-8888-6667',
    '如何缴纳地暖费？': '目前地暖缴费功能正在开发中，预计下个版本上线。届时可以通过「兰园地暖」小程序在线缴费。\n\n目前缴费方式：\n1. 到物业服务中心现场缴费\n2. 银行转账（账号请咨询物业）\n\n请关注小程序更新通知 📢',
    '周边有什么好吃的？': '小区周边美食推荐 🍜\n\n1. 「老北京炸酱面」- 步行 5 分钟，人均 30 元\n2. 「蜀九香火锅」- 开车 8 分钟，人均 120 元\n3. 「兰咖啡」- 小区底商，适合下午茶 ☕\n4. 「日日鲜超市」- 生鲜水果齐全，买菜方便\n\n还有更多美食等你发现～',
    '推荐一个周末去处': '北京周末好去处 🌿\n\n1. 🏞️ 奥林匹克森林公园 - 免费，适合遛娃跑步\n2. 🏛️ 798 艺术区 - 文艺青年必打卡\n3. 🛍️ 三里屯太古里 - 逛街美食电影一条龙\n4. 🏯 故宫博物院 - 需提前预约，感受历史文化\n\n需要我帮你规划路线吗？'
  };
  return responses[text] || '这是一个很好的问题！让我想想...\n\n目前我还在学习阶段，部分功能正在完善中。你可以尝试问我关于小区服务、周边生活等方面的问题。\n\n有什么其他我可以帮你的吗？ 😊';
}
</script>
</body>
</html>
