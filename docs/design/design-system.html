<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兰园地暖</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream: #faf7f2;
    --warm-white: #fffaf5;
    --terracotta: #c4673c;
    --terracotta-deep: #9b3d1a;
    --terracotta-light: #e8a87c;
    --ember: #d4744b;
    --clay: #b8532e;
    --sand: #f2e8dc;
    --sand-dark: #e8d5c0;
    --bark: #3d2b1f;
    --olive: #6b8e5a;
    --olive-light: #8aab7a;
    --gold: #c8963e;
    --gold-light: #e8c97a;
    --shadow-sm: 0 1px 3px rgba(61,43,31,0.06), 0 1px 2px rgba(61,43,31,0.04);
    --shadow-md: 0 4px 16px rgba(61,43,31,0.07), 0 2px 6px rgba(61,43,31,0.04);
    --shadow-lg: 0 12px 32px rgba(61,43,31,0.1), 0 4px 12px rgba(61,43,31,0.05);
    --shadow-glow: 0 0 0 1px rgba(212,116,75,0.1), 0 4px 16px rgba(212,116,75,0.12);
  }

  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    background: #ede4d8;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(212,116,75,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(200,150,62,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(107,142,90,0.05) 0%, transparent 50%);
    font-family: 'DM Sans', -apple-system, sans-serif;
  }

  .phone {
    width: 390px; height: 760px;
    background: var(--cream);
    border-radius: 36px;
    display: flex; flex-direction: column;
    box-shadow:
      0 0 0 1px rgba(61,43,31,0.08),
      0 24px 64px rgba(61,43,31,0.15),
      0 8px 24px rgba(61,43,31,0.1);
    overflow: hidden;
    position: relative;
  }

  /* ── Status Bar ── */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 24px 0;
    font-size: 11px; font-weight: 500; color: var(--bark);
  }

  /* ── Header ── */
  .app-header {
    padding: 8px 20px 12px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .app-header .title {
    font-family: 'Playfair Display', serif;
    font-size: 17px; font-weight: 700;
    color: var(--bark);
    letter-spacing: 0.5px;
  }
  .app-header .title span {
    color: var(--terracotta);
  }
  .app-header .subtitle {
    font-size: 10px; color: var(--terracotta-light);
    font-weight: 400; display: block; text-align: center;
    letter-spacing: 1px; text-transform: uppercase;
    margin-top: -1px;
  }

  /* ── Content ── */
  .content {
    flex: 1; overflow-y: auto; padding: 0 16px 12px;
    scroll-behavior: smooth;
  }
  .content::-webkit-scrollbar { width: 0; }

  /* ── Cards & Elements ── */
  .card {
    background: var(--warm-white);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
    border: 1px solid rgba(232,213,192,0.5);
    transition: box-shadow 0.3s;
  }

  .community-picker {
    display: flex; align-items: center; gap: 10px;
    background: var(--warm-white);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-glow);
    border: 1px solid rgba(212,116,75,0.12);
  }
  .community-picker .icon {
    width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(135deg, var(--terracotta-light), var(--terracotta));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #fff; flex-shrink: 0;
  }
  .community-picker select {
    border: none; background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600; color: var(--bark);
    flex: 1; outline: none; -webkit-appearance: none;
    cursor: pointer;
  }
  .community-picker .chevron {
    color: var(--terracotta-light); font-size: 12px;
  }

  /* ── Metrics Grid ── */
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .metric {
    background: var(--warm-white);
    border-radius: 16px; padding: 16px 14px;
    box-shadow: var(--shadow-sm);
    border: 1px solid rgba(232,213,192,0.4);
    position: relative; overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .metric:active { transform: scale(0.97); }
  .metric .metric-accent {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    border-radius: 16px 16px 0 0;
  }
  .metric:nth-child(1) .metric-accent { background: linear-gradient(90deg, var(--terracotta), var(--terracotta-light)); }
  .metric:nth-child(2) .metric-accent { background: linear-gradient(90deg, var(--olive), var(--olive-light)); }
  .metric:nth-child(3) .metric-accent { background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
  .metric:nth-child(4) .metric-accent { background: linear-gradient(90deg, var(--terracotta-deep), var(--terracotta)); }
  .metric .metric-label {
    font-size: 10px; font-weight: 500; letter-spacing: 0.8px;
    text-transform: uppercase; color: #a89888; margin-top: 4px; margin-bottom: 4px;
  }
  .metric .metric-value {
    font-family: 'DM Sans', sans-serif;
    font-size: 26px; font-weight: 600; color: var(--bark);
    letter-spacing: -0.5px;
  }
  .metric:nth-child(4) .metric-value { font-size: 22px; }

  .section-label {
    font-family: 'Playfair Display', serif;
    font-size: 15px; font-weight: 600; color: var(--bark);
    margin-bottom: 10px; letter-spacing: 0.3px;
  }

  /* ── Trend Chart ── */
  .chart-area {
    height: 100px; position: relative;
    background: linear-gradient(180deg, rgba(212,116,75,0.04) 0%, transparent 100%);
    border-radius: 10px; margin-top: 4px;
    display: flex; align-items: flex-end; gap: 4px; padding: 0 4px;
  }
  .chart-bar {
    flex: 1; border-radius: 4px 4px 0 0;
    background: linear-gradient(180deg, var(--terracotta-light), rgba(212,116,75,0.25));
    transition: height 0.4s ease;
    min-height: 6px;
  }
  .chart-bar:nth-child(5) { background: linear-gradient(180deg, var(--terracotta), rgba(196,103,60,0.35)); }

  /* ── Payment List ── */
  .payment-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid rgba(232,213,192,0.4);
    font-size: 12px;
  }
  .payment-row:last-child { border-bottom: none; }
  .payment-room { color: var(--bark); font-weight: 500; }
  .payment-amount { font-weight: 600; color: var(--bark); }
  .payment-time { color: #b8a898; font-size: 11px; }
  .see-more {
    text-align: center; color: var(--terracotta); font-size: 12px;
    font-weight: 500; margin-top: 10px; cursor: pointer;
    letter-spacing: 0.3px;
  }

  /* ── Feed Posts ── */
  .feed-card {
    background: var(--warm-white);
    border-radius: 16px; padding: 14px; margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
    border: 1px solid rgba(232,213,192,0.4);
  }
  .feed-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .feed-avatar {
    width: 36px; height: 36px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .feed-user { font-size: 13px; font-weight: 600; color: var(--bark); }
  .feed-meta { font-size: 10px; color: #b8a898; margin-top: 1px; }
  .feed-body { font-size: 13px; line-height: 1.6; color: #5c4a3a; margin-bottom: 10px; }
  .feed-image {
    width: 100%; height: 140px; border-radius: 10px;
    background: linear-gradient(135deg, #f5ede3, #ede0d2);
    display: flex; align-items: center; justify-content: center;
    color: var(--terracotta-light); font-size: 12px; margin-bottom: 10px;
  }
  .feed-actions {
    display: flex; gap: 20px; font-size: 12px; color: #b8a898;
    padding-top: 8px; border-top: 1px solid rgba(232,213,192,0.3);
  }
  .feed-actions span { cursor: pointer; transition: color 0.2s; }
  .feed-actions span:hover { color: var(--terracotta); }

  /* ── Chat ── */
  .chat { display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; gap: 8px; align-items: flex-start; animation: fadeIn 0.3s ease; }
  .msg.me { flex-direction: row-reverse; }
  .msg-avatar {
    width: 28px; height: 28px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 10px; font-weight: 600; flex-shrink: 0;
  }
  .msg.ai .msg-avatar { background: linear-gradient(135deg, var(--terracotta-light), var(--terracotta)); }
  .msg.me .msg-avatar { background: linear-gradient(135deg, var(--clay), var(--terracotta-deep)); }
  .msg-bubble {
    padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5;
    max-width: 78%;
  }
  .msg.ai .msg-bubble {
    background: var(--warm-white); color: var(--bark);
    box-shadow: var(--shadow-sm);
    border-bottom-left-radius: 4px;
  }
  .msg.me .msg-bubble {
    background: linear-gradient(135deg, var(--ember), var(--clay));
    color: #fff; border-bottom-right-radius: 4px;
  }
  .msg.ai .msg-bubble b { color: var(--terracotta); }
  .chat-input-wrap {
    display: flex; align-items: center; gap: 8px;
    background: var(--warm-white);
    border-radius: 18px; padding: 6px 6px 6px 16px;
    margin-top: 12px;
    box-shadow: var(--shadow-md);
    border: 1px solid rgba(232,213,192,0.4);
  }
  .chat-input-wrap input {
    border: none; background: transparent; flex: 1; outline: none;
    font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--bark);
  }
  .chat-input-wrap input::placeholder { color: #c8b8a8; }
  .send-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--terracotta), var(--clay));
    border: none; color: #fff; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .send-btn:active { transform: scale(0.92); }

  /* ── Profile ── */
  .profile-card {
    text-align: center; padding: 28px 0 20px;
  }
  .profile-avatar-lg {
    width: 68px; height: 68px; border-radius: 20px;
    background: linear-gradient(135deg, var(--terracotta-light), var(--terracotta-deep));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 26px; font-weight: 600;
    margin: 0 auto 12px;
    box-shadow: var(--shadow-lg);
  }
  .profile-name { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; color: var(--bark); }
  .profile-handle { font-size: 12px; color: #b8a898; margin-top: 2px; }

  .menu-list {
    background: var(--warm-white); border-radius: 16px;
    overflow: hidden; box-shadow: var(--shadow-sm);
    border: 1px solid rgba(232,213,192,0.4);
  }
  .menu-item {
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(232,213,192,0.3);
    font-size: 13px; color: var(--bark); cursor: pointer;
    transition: background 0.15s;
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:active { background: rgba(212,116,75,0.04); }
  .menu-item .menu-icon { margin-right: 10px; font-size: 16px; }
  .menu-item .arrow { color: #c8b8a8; font-size: 12px; }
  .menu-item.logout { color: var(--terracotta); }

  /* ── Tab Bar ── */
  .tab-bar {
    display: flex; background: var(--warm-white);
    border-top: 1px solid rgba(232,213,192,0.4);
    padding: 4px 8px 12px;
    position: relative;
  }
  .tab-item {
    flex: 1; text-align: center; padding: 6px 0; cursor: pointer;
    font-size: 10px; font-weight: 500; color: #c8b8a8;
    transition: all 0.25s;
    position: relative;
  }
  .tab-item .tab-icon { font-size: 20px; display: block; margin-bottom: 3px; transition: transform 0.25s; }
  .tab-item.active { color: var(--terracotta); font-weight: 600; }
  .tab-item.active .tab-icon { transform: translateY(-2px); }

  /* ── FAB ── */
  .fab {
    position: absolute; bottom: 88px; right: 20px;
    width: 46px; height: 46px; border-radius: 16px;
    background: linear-gradient(135deg, var(--ember), var(--clay));
    color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lg); cursor: pointer; z-index: 10;
    transition: transform 0.25s, box-shadow 0.25s;
  }
  .fab:active { transform: scale(0.92) rotate(90deg); }

  /* ── Animations ── */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .stagger-1 { animation: fadeIn 0.4s ease both; }
  .stagger-2 { animation: fadeIn 0.4s 0.06s ease both; }
  .stagger-3 { animation: fadeIn 0.4s 0.12s ease both; }
  .stagger-4 { animation: fadeIn 0.4s 0.18s ease both; }

  .fade-switch { animation: fadeIn 0.3s ease both; }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●● WiFi</span>
  </div>
  <div class="app-header">
    <div>
      <div class="title">兰园<span>·</span>地暖</div>
      <div class="subtitle" id="headerSub">缴费看板</div>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="tab-bar">
    <div class="tab-item active" data-tab="dashboard" onclick="switchTab('dashboard')">
      <span class="tab-icon">◈</span>看板
    </div>
    <div class="tab-item" data-tab="community" onclick="switchTab('community')">
      <span class="tab-icon">◇</span>社区
    </div>
    <div class="tab-item" data-tab="ai" onclick="switchTab('ai')">
      <span class="tab-icon">○</span>AI
    </div>
    <div class="tab-item" data-tab="profile" onclick="switchTab('profile')">
      <span class="tab-icon">◎</span>我的
    </div>
  </div>
</div>

<script>
const subtitles = { dashboard: '缴费看板', community: '温度社区', ai: 'AI 助手', profile: '个人中心' };

function switchTab(tab) {
  document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  document.getElementById('headerSub').textContent = subtitles[tab];

  const existingFab = document.querySelector('.fab');
  if (existingFab) existingFab.remove();

  const c = document.getElementById('content');

  if (tab === 'dashboard') {
    c.innerHTML = `
      <div class="community-picker stagger-1">
        <div class="icon">🏘</div>
        <select><option>东方兰园</option><option>格调壹品</option><option>天虹菁英汇</option><option>金泰悦城</option></select>
        <div class="chevron">▾</div>
      </div>
      <div class="metrics">
        <div class="metric stagger-1"><div class="metric-accent"></div><div class="metric-label">总户数</div><div class="metric-value">1,516</div></div>
        <div class="metric stagger-2"><div class="metric-accent"></div><div class="metric-label">已缴费</div><div class="metric-value">1,246</div></div>
        <div class="metric stagger-3"><div class="metric-accent"></div><div class="metric-label">缴费比例</div><div class="metric-value">82.2%</div></div>
        <div class="metric stagger-4"><div class="metric-accent"></div><div class="metric-label">总金额</div><div class="metric-value">¥49.8万</div></div>
      </div>
      <div class="card stagger-2">
        <div class="section-label">每日趋势</div>
        <div class="chart-area">
          <div class="chart-bar" style="height:40%"></div><div class="chart-bar" style="height:55%"></div><div class="chart-bar" style="height:70%"></div><div class="chart-bar" style="height:45%"></div><div class="chart-bar" style="height:90%"></div><div class="chart-bar" style="height:60%"></div><div class="chart-bar" style="height:75%"></div>
        </div>
      </div>
      <div class="card stagger-3">
        <div class="section-label">最新缴费</div>
        <div class="payment-row"><span class="payment-room">3-1-502</span><span class="payment-amount">¥3,200</span><span class="payment-time">05-23</span></div>
        <div class="payment-row"><span class="payment-room">2-3-1201</span><span class="payment-amount">¥3,200</span><span class="payment-time">05-23</span></div>
        <div class="payment-row"><span class="payment-room">1-2-808</span><span class="payment-amount">¥3,200</span><span class="payment-time">05-22</span></div>
        <div class="payment-row"><span class="payment-room">4-1-301</span><span class="payment-amount">¥2,850</span><span class="payment-time">05-22</span></div>
        <div class="see-more">查看全部 →</div>
      </div>
    `;
  } else if (tab === 'community') {
    const fab = document.createElement('div');
    fab.className = 'fab';
    fab.innerHTML = '+';
    fab.onclick = () => { const p = document.querySelector('.phone'); const toast = document.createElement('div'); toast.style.cssText = 'position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:var(--bark);color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;z-index:20;animation:fadeIn 0.3s ease;'; toast.textContent = '发布动态'; p.appendChild(toast); setTimeout(() => toast.remove(), 1500); };
    document.querySelector('.phone').appendChild(fab);

    c.innerHTML = `
      <div class="feed-card stagger-1">
        <div class="feed-header">
          <div class="feed-avatar" style="background:linear-gradient(135deg,#e8a87c,#c4673c);">张</div>
          <div><div class="feed-user">张三</div><div class="feed-meta">东方兰园 · 23°C · 2小时前</div></div>
        </div>
        <div class="feed-body">供暖第一天，屋里终于暖和了！地暖的温度刚刚好，孩子在家可以光脚跑了 🌡️</div>
        <div class="feed-image">📷 室内温度实拍</div>
        <div class="feed-actions"><span>♡ 12</span><span>💬 3</span><span style="margin-left:auto;color:#c8b8a8;">分享</span></div>
      </div>
      <div class="feed-card stagger-2">
        <div class="feed-header">
          <div class="feed-avatar" style="background:linear-gradient(135deg,#c4673c,#9b3d1a);">李</div>
          <div><div class="feed-user">李四</div><div class="feed-meta">格调壹品 · 21°C · 5小时前</div></div>
        </div>
        <div class="feed-body">温度刚好，不冷不热很舒服。今年的供暖比去年稳定多了</div>
        <div class="feed-actions"><span>♡ 8</span><span>💬 1</span><span style="margin-left:auto;color:#c8b8a8;">分享</span></div>
      </div>
      <div class="feed-card stagger-3">
        <div class="feed-header">
          <div class="feed-avatar" style="background:linear-gradient(135deg,#d4a88c,#b87050);">王</div>
          <div><div class="feed-user">王五</div><div class="feed-meta">天虹菁英汇 · 24°C · 昨天</div></div>
        </div>
        <div class="feed-body">新换的暖气片效果真不错！推荐大家都换一下 🔥</div>
        <div class="feed-actions"><span>♡ 15</span><span>💬 5</span><span style="margin-left:auto;color:#c8b8a8;">分享</span></div>
      </div>
    `;
  } else if (tab === 'ai') {
    c.innerHTML = `
      <div class="chat fade-switch">
        <div class="msg ai">
          <div class="msg-avatar">AI</div>
          <div class="msg-bubble">你好！我是地暖助手，可以帮你查询缴费数据。试试问我<b>"3号楼缴费比例"</b></div>
        </div>
        <div class="msg me">
          <div class="msg-avatar">我</div>
          <div class="msg-bubble">3号楼有多少户缴费了？</div>
        </div>
        <div class="msg ai">
          <div class="msg-avatar">AI</div>
          <div class="msg-bubble">3号楼共<b>48户</b>，已缴费<b>42户</b>，缴费比例<b>87.5%</b>。未缴房间：301、502、1203、1501、1702、1804</div>
        </div>
      </div>
      <div class="chat-input-wrap fade-switch">
        <input placeholder="输入查询问题..." id="aiInput">
        <button class="send-btn" onclick="(function(){const v=document.getElementById('aiInput');if(v.value.trim()){const chat=document.querySelector('.chat');chat.insertAdjacentHTML('beforeend','<div class=\\'msg me\\'><div class=\\'msg-avatar\\'>我</div><div class=\\'msg-bubble\\'>'+v.value+'</div></div>');v.value='';chat.scrollTop=chat.scrollHeight;}})();">→</button>
      </div>
    `;
  } else if (tab === 'profile') {
    c.innerHTML = `
      <div class="profile-card stagger-1">
        <div class="profile-avatar-lg">张</div>
        <div class="profile-name">张三</div>
        <div class="profile-handle">@zhangsan · 东方兰园</div>
