<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 助手 · 兰园</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --cream:#faf7f2;--warm-white:#fffaf5;--terracotta:#c4673c;--terracotta-deep:#9b3d1a;
    --terracotta-light:#e8a87c;--ember:#d4744b;--clay:#b8532e;--sand:#f2e8dc;
    --sand-dark:#e8d5c0;--bark:#3d2b1f;
    --shadow-sm:0 1px 3px rgba(61,43,31,0.06),0 1px 2px rgba(61,43,31,0.04);
    --shadow-md:0 4px 16px rgba(61,43,31,0.07),0 2px 6px rgba(61,43,31,0.04);
    --shadow-lg:0 12px 32px rgba(61,43,31,0.1),0 4px 12px rgba(61,43,31,0.05);
  }
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;
    background:#ede4d8;font-family:'DM Sans',-apple-system,sans-serif;
    background-image:radial-gradient(ellipse at 20% 50%,rgba(212,116,75,0.08) 0%,transparent 50%),
      radial-gradient(ellipse at 80% 20%,rgba(200,150,62,0.06) 0%,transparent 50%);}
  .phone{width:390px;height:760px;background:var(--cream);border-radius:36px;display:flex;flex-direction:column;
    box-shadow:0 0 0 1px rgba(61,43,31,0.08),0 24px 64px rgba(61,43,31,0.15),0 8px 24px rgba(61,43,31,0.1);overflow:hidden;position:relative}
  .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 0;font-size:11px;font-weight:500;color:var(--bark)}
  .app-header{padding:6px 20px 10px;display:flex;align-items:center;justify-content:center;position:relative}
  .app-header .title{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--bark);letter-spacing:0.5px}
  .app-header .title span{color:var(--terracotta)}
  .page-content{flex:1;padding:0 16px 8px;scroll-behavior:smooth;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
  .page-content::-webkit-scrollbar{display:none}

  /* ── Chat ── */
  .chat{display:flex;flex-direction:column;gap:12px}
  .msg{display:flex;gap:8px;align-items:flex-start;animation:fadeIn 0.3s ease}
  .msg.me{flex-direction:row-reverse}
  .msg-avatar{width:28px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:10px;font-weight:600;flex-shrink:0}
  .msg.ai .msg-avatar{background:linear-gradient(135deg,var(--terracotta-light),var(--terracotta))}
  .msg.me .msg-avatar{background:linear-gradient(135deg,var(--clay),var(--terracotta-deep))}
  .msg-bubble{padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;max-width:78%}
  .msg.ai .msg-bubble{background:var(--warm-white);color:var(--bark);box-shadow:var(--shadow-sm);
    border:1px solid rgba(232,213,192,0.3);border-bottom-left-radius:4px}
  .msg.me .msg-bubble{background:linear-gradient(135deg,var(--ember),var(--clay));color:#fff;
    border-bottom-right-radius:4px}
  .msg.ai .msg-bubble b{color:var(--terracotta)}
  .chat-input-wrap{display:flex;align-items:center;gap:8px;
    background:var(--warm-white);border-radius:18px;padding:6px 6px 6px 16px;
    margin:8px 16px 0;box-shadow:var(--shadow-md);border:1px solid rgba(232,213,192,0.4);flex-shrink:0}
  .chat-input-wrap textarea{border:none;background:transparent;flex:1;outline:none;
    font-family:'DM Sans',sans-serif;font-size:13px;color:var(--bark);resize:none;line-height:1.4;padding:8px 0;overflow:hidden;min-height:20px}
  .chat-input-wrap textarea::placeholder{color:#c8b8a8}
  .send-btn{width:32px;height:32px;border-radius:50%;
    background:linear-gradient(135deg,var(--terracotta),var(--clay));
    border:none;color:#fff;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform 0.2s,box-shadow 0.2s;
    font-family:'DM Sans',sans-serif;font-weight:600}
  .send-btn:active{transform:scale(0.92)}
  .send-btn:disabled{background:#d8c8b8;cursor:not-allowed}

  /* ── Tab bar ── */
  .tab-bar{display:flex;background:var(--warm-white);border-top:1px solid rgba(232,213,192,0.4);position:relative}
  .tab{flex:1;text-align:center;padding:6px 0;cursor:pointer;font-size:10px;font-weight:500;
    color:#c8b8a8;transition:all 0.25s;position:relative;text-decoration:none}
  .tab .tab-icon{font-size:20px;display:block;margin-bottom:3px;transition:transform 0.25s}
  .tab .tab-icon svg{width:20px;height:20px;display:block;margin:0 auto 3px}
  .tab.active{color:var(--terracotta);font-weight:600}
  .tab.active .tab-icon svg{transform:translateY(-2px)}
  .home-indicator{height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .home-indicator .bar{width:134px;height:5px;background:var(--bark);border-radius:3px;opacity:0.15}

  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .stagger-1{animation:fadeIn 0.4s ease both}
  .stagger-2{animation:fadeIn 0.4s 0.06s ease both}
  .stagger-3{animation:fadeIn 0.4s 0.12s ease both}
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar"><span>9:41</span><span style="font-size:12px;opacity:0.5">●●● WiFi</span></div>
  <div class="app-header"><div class="title">AI <span>助手</span></div></div>

  <div class="page-content" id="content">
    <div class="chat">
      <div class="msg ai stagger-1">
        <div class="msg-avatar">AI</div>
        <div class="msg-bubble">你好！我是兰园 AI 助手，可以帮你解答小区相关问题。试试问我<b>"小区物业电话多少？"</b></div>
      </div>
      <div class="msg me stagger-2">
        <div class="msg-avatar">我</div>
        <div class="msg-bubble">小区物业电话多少？</div>
      </div>
      <div class="msg ai stagger-3">
        <div class="msg-avatar">AI</div>
        <div class="msg-bubble">兰园小区物业服务中心 ☎️ <b>010-8888-6666</b><br><br>办公时间：周一至周五 8:30-17:30<br>周末及节假日：9:00-16:00<br><br>紧急情况可拨打 24 小时值班电话：010-8888-6667</div>
      </div>
    </div>
  </div>

  <!-- Fixed input bar -->
  <div class="chat-input-wrap">
    <textarea rows="1" placeholder="输入消息…" id="aiInput" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}" oninput="updateSend();autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" disabled onclick="sendMsg()">→</button>
  </div>

  <!-- Tab bar: 社交 → AI → 我的 -->
  <div class="tab-bar">
    <a href="v3-social-feed.html" class="tab">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>社交
    </a>
    <a href="v3-ai-chat.html" class="tab active">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>AI
    </a>
    <a href="v3-profile.html" class="tab">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>我的
    </a>
  </div>
  <div class="home-indicator"><div class="bar"></div></div>
</div>

<script>
function updateSend() {
  document.getElementById('sendBtn').disabled = !document.getElementById('aiInput').value.trim();
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function sendMsg() {
  var input = document.getElementById('aiInput');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  updateSend();
  var chat = document.querySelector('.chat');
  // Add user message
  chat.insertAdjacentHTML('beforeend',
    '<div class="msg me" style="animation:fadeIn 0.3s ease both">' +
    '<div class="msg-avatar">我</div>' +
    '<div class="msg-bubble">' + text.replace(/\n/g, '<br>') + '</div></div>');
  var content = document.getElementById('content');
  content.scrollTop = content.scrollHeight;
  // Auto reply after delay
  setTimeout(function() {
    var replies = [
      '好的，我记下了！还有什么可以帮你的吗？😊',
      '这是一个很好的问题！让我想想…\n\n你可以试试问我：\n• 小区物业电话多少？\n• 周边有什么好吃的？\n• 推荐一个周末去处'
    ];
    var reply = replies[Math.floor(Math.random() * replies.length)];
    chat.insertAdjacentHTML('beforeend',
      '<div class="msg ai" style="animation:fadeIn 0.3s ease both">' +
      '<div class="msg-avatar">AI</div>' +
      '<div class="msg-bubble">' + reply + '</div></div>');
    content.scrollTop = content.scrollHeight;
  }, 1200 + Math.random() * 800);
}
</script>
</body>
</html>
