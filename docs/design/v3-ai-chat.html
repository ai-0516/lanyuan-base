<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 助手 · 兰园</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --cream:#faf7f2;--warm-white:#fffaf5;--terracotta:#c4673c;--terracotta-deep:#9b3d1a;
    --terracotta-light:#e8a87c;--ember:#d4744b;--clay:#b8532e;--sand:#f2e8dc;
    --sand-dark:#e8d5c0;--bark:#3d2b1f;
    --shadow-sm:0 1px 3px rgba(61,43,31,0.06),0 1px 2px rgba(61,43,31,0.04);
    --shadow-md:0 4px 16px rgba(61,43,31,0.07),0 2px 6px rgba(61,43,31,0.04);
    --shadow-lg:0 12px 32px rgba(61,43,31,0.1),0 4px 12px rgba(61,43,31,0.05);
  }
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;
    background:#ede4d8;font-family:'DM Sans',-apple-system,sans-serif;
    background-image:radial-gradient(ellipse at 20% 50%,rgba(212,116,75,0.08) 0%,transparent 50%),
      radial-gradient(ellipse at 80% 20%,rgba(200,150,62,0.06) 0%,transparent 50%);}
  .phone{width:390px;height:760px;background:var(--cream);border-radius:36px;display:flex;flex-direction:column;
    box-shadow:0 0 0 1px rgba(61,43,31,0.08),0 24px 64px rgba(61,43,31,0.15),0 8px 24px rgba(61,43,31,0.1);overflow:hidden;position:relative}
  .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 0;font-size:11px;font-weight:500;color:var(--bark)}
  .app-header{padding:6px 20px 10px;display:flex;align-items:center;justify-content:center;position:relative}
  .app-header .title{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--bark);letter-spacing:0.5px}
  .app-header .title span{color:var(--terracotta)}
  .page-content{flex:1;overflow-y:auto;padding:0 16px 8px;scroll-behavior:smooth}
  .page-content::-webkit-scrollbar{width:0}
  .manage-btn{position:absolute;right:20px;font-size:12px;color:var(--terracotta);cursor:pointer;text-decoration:none;font-weight:500}
  .back-btn{position:absolute;left:16px;font-size:13px;color:var(--terracotta);cursor:pointer;text-decoration:none;font-weight:500;display:none}
  .nav-mid{text-align:center}

  /* History list */
  .history-view{padding-top:4px}
  .new-chat-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 0;
    background:linear-gradient(135deg,var(--ember),var(--clay));color:#fff;border:none;border-radius:14px;
    font-size:14px;font-weight:600;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;
    box-shadow:var(--shadow-md);margin-bottom:12px}
  .new-chat-btn:active{transform:scale(0.97)}
  .new-chat-btn svg{width:16px;height:16px}
  .history-list{background:var(--warm-white);border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow-sm);border:1px solid rgba(232,213,192,0.4)}
  .conv-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(232,213,192,0.3);
    cursor:pointer;transition:background 0.15s;gap:12px}
  .conv-item:last-child{border-bottom:none}
  .conv-item:active{background:rgba(196,103,60,0.04)}
  .conv-icon{width:38px;height:38px;border-radius:12px;
    background:linear-gradient(135deg,var(--terracotta-light),var(--terracotta));
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .conv-icon svg{width:18px;height:18px;color:#fff}
  .conv-body{flex:1;min-width:0}
  .conv-title{font-size:13px;font-weight:600;color:var(--bark);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-preview{font-size:11px;color:#b8a898;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-meta{text-align:right;flex-shrink:0}
  .conv-time{font-size:10px;color:#d8c8b8;margin-bottom:2px}
  .conv-count{font-size:10px;color:#b8a898;background:var(--cream);padding:1px 7px;border-radius:8px;display:inline-block}

  /* Chat view */
  .chat-view{display:none;flex-direction:column;flex:1}
  .chat-messages{flex:1;overflow-y:auto;padding:8px 16px 4px;display:flex;flex-direction:column;gap:14px}
  .welcome{text-align:center;margin-top:40px}
  .welcome-icon{width:56px;height:56px;background:linear-gradient(135deg,var(--terracotta-light),var(--terracotta));
    border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .welcome-icon svg{width:26px;height:26px;color:#fff}
  .welcome-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--bark);margin-bottom:4px}
  .welcome-sub{font-size:12px;color:#b8a898;margin-bottom:24px}
  .quick-prompts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .quick-prompt{padding:8px 14px;background:var(--warm-white);border:1px solid rgba(232,213,192,0.5);
    border-radius:16px;font-size:12px;color:#7a6a5a;cursor:pointer;transition:all 0.2s;text-align:left}
  .quick-prompt:hover{border-color:var(--terracotta-light);color:var(--terracotta)}
  .msg{display:flex;gap:8px;animation:msgIn 0.3s ease}
  .msg.user{flex-direction:row-reverse}
  .msg-avatar{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .msg-avatar.user{background:linear-gradient(135deg,var(--clay),var(--terracotta-deep))}
  .msg-avatar.ai{background:linear-gradient(135deg,var(--terracotta-light),var(--terracotta))}
  .msg-avatar svg{width:14px;height:14px;color:#fff}
  .bubble{max-width:75%;padding:10px 14px;font-size:13px;line-height:1.55;word-break:break-word;white-space:pre-line}
  .bubble.user{background:linear-gradient(135deg,var(--ember),var(--clay));color:#fff;border-radius:14px 4px 14px 14px}
  .bubble.ai{background:var(--warm-white);color:var(--bark);border-radius:4px 14px 14px 14px;box-shadow:var(--shadow-sm);border:1px solid rgba(232,213,192,0.3)}
  @keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .typing{display:none;align-items:center;gap:8px;padding-left:8px}
  .typing .dots{display:flex;gap:4px;padding:10px 14px;background:var(--warm-white);border-radius:14px;box-shadow:var(--shadow-sm)}
  .typing .dots span{width:6px;height:6px;border-radius:50%;background:#d8c8b8;animation:typingDot 1.4s infinite}
  .typing .dots span:nth-child(2){animation-delay:0.2s}
  .typing .dots span:nth-child(3){animation-delay:0.4s}
  @keyframes typingDot{0%,60%,100%{opacity:0.3;transform:scale(1)}30%{opacity:1;transform:scale(1.3)}}
  .input-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--warm-white);border-top:1px solid rgba(232,213,192,0.4);flex-shrink:0}
  .input-bar input{flex:1;padding:10px 16px;background:var(--cream);border:none;border-radius:20px;font-size:14px;outline:none;font-family:'DM Sans',sans-serif;transition:box-shadow 0.2s}
  .input-bar input:focus{box-shadow:0 0 0 2px rgba(196,103,60,0.15)}
  .send-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--ember),var(--clay));
    color:#fff;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:transform 0.2s,box-shadow 0.2s;flex-shrink:0}
  .send-btn:active{transform:scale(0.9)}
  .send-btn:disabled{background:#d8c8b8;cursor:not-allowed}
  .send-btn svg{width:16px;height:16px}

  /* Tab bar */
  .tab-bar{display:flex;background:var(--warm-white);border-top:1px solid rgba(232,213,192,0.4);padding:4px 8px 14px;position:relative}
  .tab{flex:1;text-align:center;padding:6px 0;cursor:pointer;font-size:10px;font-weight:500;color:#c8b8a8;transition:all 0.25s;position:relative;text-decoration:none}
  .tab .tab-icon{font-size:20px;display:block;margin-bottom:3px;transition:transform 0.25s}
  .tab.active{color:var(--terracotta);font-weight:600}
  .tab.active .tab-icon{transform:translateY(-2px)}
  .home-indicator{height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .home-indicator .bar{width:134px;height:5px;background:var(--bark);border-radius:3px;opacity:0.15}
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar"><span>9:41</span><span style="font-size:12px;opacity:0.5">●●● WiFi</span></div>
  <div class="app-header" style="padding-bottom:4px">
    <a href="javascript:backToHistory()" class="back-btn" id="backBtn">‹ 返回</a>
    <div class="nav-mid">
      <div class="title" id="navTitle">AI <span>助手</span></div>
      <div style="font-size:10px;color:#b8a898;letter-spacing:1px;margin-top:-2px">deepseek 驱动</div>
    </div>
    <a href="v3-ai-history.html" class="manage-btn" id="manageBtn">管理</a>
  </div>

  <!-- History list view -->
  <div class="page-content history-view" id="historyView">
    <button class="new-chat-btn" onclick="startNewChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新对话
    </button>
    <div class="history-list">
      <div class="conv-item" onclick="openChat('小区物业电话咨询','昨天')">
        <div class="conv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div>
        <div class="conv-body"><div class="conv-title">小区物业电话咨询</div><div class="conv-preview">兰园小区物业服务中心 ☎️ 010-8888-6666…</div></div>
        <div class="conv-meta"><div class="conv-time">昨天</div><span class="conv-count">4条</span></div>
      </div>
      <div class="conv-item" onclick="openChat('周末去哪玩推荐','3天前')">
        <div class="conv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div>
        <div class="conv-body"><div class="conv-title">周末去哪玩推荐</div><div class="conv-preview">北京周末好去处 🌿 奥林匹克森林公园、798…</div></div>
        <div class="conv-meta"><div class="conv-time">3天前</div><span class="conv-count">6条</span></div>
      </div>
      <div class="conv-item" onclick="openChat('周边美食推荐','1周前')">
        <div class="conv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div>
        <div class="conv-body"><div class="conv-title">周边美食推荐</div><div class="conv-preview">小区周边美食推荐 🍜 老北京炸酱面、蜀九香…</div></div>
        <div class="conv-meta"><div class="conv-time">1周前</div><span class="conv-count">3条</span></div>
      </div>
    </div>
  </div>

  <!-- Chat view -->
  <div class="chat-view" id="chatView">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="typing" id="typing">
      <div class="msg-avatar ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="输入消息…" oninput="updateSend()" onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="send-btn" id="sendBtn" disabled onclick="sendMsg()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polyline points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <a href="v3-social-feed.html" class="tab"><span class="tab-icon">◆</span>社交</a>
    <a href="v3-ai-chat.html" class="tab active"><span class="tab-icon">◇</span>AI</a>
    <a href="v3-profile.html" class="tab"><span class="tab-icon">◈</span>我的</a>
  </div>
  <div class="home-indicator"><div class="bar"></div></div>
</div>

<script>
var currentChat = null;
function startNewChat() {
  currentChat = '新对话'; showChatView();
  var msgs = document.getElementById('chatMessages');
  msgs.innerHTML = '<div class="welcome" id="welcomeMsg">' +
    '<div class="welcome-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div>' +
    '<div class="welcome-title">你好，我是兰园 AI 助手</div>' +
    '<div class="welcome-sub">基于 DeepSeek，随时为你解答</div>' +
    '<div class="quick-prompts">' +
      '<span class="quick-prompt" onclick="sendQuick(this)">小区物业电话多少？</span>' +
      '<span class="quick-prompt" onclick="sendQuick(this)">周边有什么好吃的？</span>' +
      '<span class="quick-prompt" onclick="sendQuick(this)">推荐一个周末去处</span>' +
      '<span class="quick-prompt" onclick="sendQuick(this)">小区停车怎么收费</span>' +
    '</div></div>';
  document.getElementById('msgInput').focus();
}
function openChat(title) {
  currentChat = title; showChatView();
  var msgs = document.getElementById('chatMessages'); msgs.innerHTML = '';
  if (title.includes('物业')) { addMsg('user','小区物业电话多少？'); addMsg('ai','兰园小区物业服务中心 ☎️ 010-8888-6666\n\n办公时间：周一至周五 8:30-17:30\n周末及节假日：9:00-16:00\n\n紧急情况可拨打 24 小时值班电话：010-8888-6667'); }
  else if (title.includes('周末')) { addMsg('user','推荐一个周末去处'); addMsg('ai','北京周末好去处 🌿\n\n1. 🏞️ 奥林匹克森林公园 - 免费，适合遛娃跑步\n2. 🏛️ 798 艺术区 - 文艺青年必打卡\n3. 🛍️ 三里屯太古里 - 逛街美食电影一条龙\n4. 🏯 故宫博物院 - 需提前预约\n\n需要我帮你规划路线吗？'); }
  else if (title.includes('美食')) { addMsg('user','周边有什么好吃的？'); addMsg('ai','小区周边美食推荐 🍜\n\n1.「老北京炸酱面」- 步行 5 分钟，人均 30 元\n2.「蜀九香火锅」- 开车 8 分钟，人均 120 元\n3.「兰咖啡」- 小区底商 ☕\n4.「日日鲜超市」- 买菜方便\n\n还有更多美食等你发现～'); }
  document.getElementById('msgInput').focus();
}
function showChatView() {
  document.getElementById('historyView').style.display = 'none';
  document.getElementById('chatView').style.display = 'flex';
  document.getElementById('navTitle').innerHTML = (currentChat || 'AI') + ' <span style="color:#b8a898;font-family:\'DM Sans\',sans-serif;font-size:10px;font-weight:400;display:block;letter-spacing:0.5px;margin-top:-2px">对话中</span>';
  document.getElementById('backBtn').style.display = 'block';
  document.getElementById('manageBtn').style.display = 'none';
}
function backToHistory() {
  document.getElementById('historyView').style.display = 'block';
  document.getElementById('chatView').style.display = 'none';
  document.getElementById('navTitle').innerHTML = 'AI <span style="color:#b8a898;font-size:10px;font-weight:400;display:block;letter-spacing:1px;margin-top:-2px">deepseek 驱动</span>';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('manageBtn').style.display = 'block';
  currentChat = null;
}
function addMsg(type, text) {
  var msgs = document.getElementById('chatMessages');
  var div = document.createElement('div'); div.className = 'msg ' + type;
  var avatarHtml = type === 'user'
    ? '<div class="msg-avatar user"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>'
    : '<div class="msg-avatar ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div>';
  div.innerHTML = avatarHtml + '<div class="bubble ' + type + '">' + text + '</div>';
  msgs.appendChild(div); msgs.scrollTop = msgs.scrollHeight;
}
function updateSend() {
  document.getElementById('sendBtn').disabled = !document.getElementById('msgInput').value.trim();
}
function sendQuick(el) {
  document.getElementById('msgInput').value = el.textContent; updateSend(); sendMsg();
}
function sendMsg() {
  var input = document.getElementById('msgInput'); var text = input.value.trim();
  if (!text) return; input.value = ''; updateSend();
  var w = document.getElementById('welcomeMsg'); if (w) w.remove();
  addMsg('user', text);
  var typing = document.getElementById('typing'); typing.style.display = 'flex';
  document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
  setTimeout(function(){
    typing.style.display = 'none';
    var responses = {
      '小区物业电话多少？': '兰园小区物业服务中心 ☎️ 010-8888-6666\n\n办公时间：周一至周五 8:30-17:30\n周末及节假日：9:00-16:00\n\n紧急情况可拨打 24 小时值班电话：010-8888-6667',
      '周边有什么好吃的？': '小区周边美食推荐 🍜\n\n1.「老北京炸酱面」- 步行 5 分钟，人均 30 元\n2.「蜀九香火锅」- 开车 8 分钟，人均 120 元\n3.「兰咖啡」- 小区底商 ☕\n4.「日日鲜超市」- 买菜方便',
      '推荐一个周末去处': '北京周末好去处 🌿\n\n1. 🏞️ 奥林匹克森林公园 - 免费，适合遛娃跑步\n2. 🏛️ 798 艺术区 - 文艺青年必打卡\n3. 🛍️ 三里屯太古里 - 逛街美食电影一条龙\n4. 🏯 故宫博物院 - 需提前预约',
      '小区停车怎么收费': '兰园小区停车收费标准 🅿️\n\n业主车辆：\n- 地面车位：120 元/月\n- 地下车位：240 元/月\n- 临时停车：5元/小时，封顶 20 元/天\n\n访客车辆：\n- 前 30 分钟免费\n- 超出后 5 元/小时，封顶 30 元/天'
    };
    addMsg('ai', responses[text] || '这是一个很好的问题！让我想想…\n\n目前我还在学习阶段，部分功能正在完善中。你可以尝试问我关于小区服务、周边生活等方面的问题。😊');
  }, 1500 + Math.random() * 1000);
}
</script>
</body>
</html>
