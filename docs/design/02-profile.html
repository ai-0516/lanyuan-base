<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 · 兰园</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#e8e8e8;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.phone{width:375px;height:812px;background:#f5f5f5;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.12);display:flex;flex-direction:column}
.status-bar{height:44px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600;flex-shrink:0;color:#1a1a1a}
.nav-bar{height:44px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;position:relative;flex-shrink:0}
.nav-bar .title{color:#1a1a1a}
.page-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Profile header */
.profile-header{background:#fff;padding:28px 20px 24px;text-align:center;margin-bottom:12px}
.avatar{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#E8F8EE,#D4F5E2);margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.avatar svg{width:34px;height:34px;color:#07C160}
.nickname{font-size:20px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.community-info{display:flex;justify-content:center;gap:12px;font-size:13px;color:#888;margin-top:10px}
.community-info span{background:#f5f5f5;padding:5px 14px;border-radius:14px;font-weight:500}
.edit-btn{display:inline-flex;align-items:center;gap:4px;margin-top:16px;font-size:13px;color:#07C160;cursor:pointer;padding:5px 18px;border:1.5px solid #07C160;border-radius:18px;transition:all 0.2s;text-decoration:none;font-weight:500}
.edit-btn:hover{background:#E8F8EE}
.edit-btn svg{width:13px;height:13px}

/* Notification row */
.notify-row{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:14px 20px;margin-bottom:12px;cursor:pointer;transition:background 0.15s}
.notify-row:hover{background:#fafafa}
.notify-left{display:flex;align-items:center;gap:12px}
.notify-icon-wrap{width:40px;height:40px;border-radius:10px;background:#FFF3E0;display:flex;align-items:center;justify-content:center}
.notify-icon-wrap svg{width:20px;height:20px;color:#FF9500}
.notify-label{font-size:15px;color:#1a1a1a}
.notify-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.badge{background:#FF3B30;color:#fff;font-size:11px;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.arrow-svg{width:16px;height:16px;color:#ccc}

/* Menu section */
.menu-section{background:#fff;margin-bottom:12px}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background 0.15s;text-decoration:none;color:inherit}
.menu-item:hover{background:#fafafa}
.menu-item:last-child{border-bottom:none}
.menu-left{display:flex;align-items:center;gap:12px}
.menu-icon-wrap{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.menu-icon-wrap.green{background:#E8F8EE}
.menu-icon-wrap.blue{background:#E8F0FE}
.menu-icon-wrap.orange{background:#FFF3E0}
.menu-icon-wrap.gray{background:#f0f0f0}
.menu-icon-wrap svg{width:16px;height:16px}
.menu-icon-wrap.green svg{color:#07C160}
.menu-icon-wrap.blue svg{color:#3B82F6}
.menu-icon-wrap.orange svg{color:#FF9500}
.menu-icon-wrap.gray svg{color:#666}
.menu-label{font-size:15px;color:#1a1a1a}
.menu-right{display:flex;align-items:center;gap:6px}
.menu-value{font-size:13px;color:#999}

/* Tab bar */
.tab-bar{height:56px;background:#fafafa;border-top:1px solid #eee;display:flex;align-items:center;flex-shrink:0;padding-bottom:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#999;font-size:10px;gap:3px;transition:color 0.2s;text-decoration:none}
.tab.active{color:#07C160}
.tab svg{width:22px;height:22px}
.tab span.label{font-size:10px}
.home-indicator{height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.home-indicator .bar{width:134px;height:5px;background:#1a1a1a;border-radius:3px}
</style>
