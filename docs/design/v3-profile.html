<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 · 兰园</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --cream:#faf7f2;--warm-white:#fffaf5;--terracotta:#c4673c;--terracotta-deep:#9b3d1a;
    --terracotta-light:#e8a87c;--ember:#d4744b;--clay:#b8532e;--sand:#f2e8dc;
    --sand-dark:#e8d5c0;--bark:#3d2b1f;--olive:#6b8e5a;--olive-light:#8aab7a;
    --gold:#c8963e;--gold-light:#e8c97a;
    --shadow-sm:0 1px 3px rgba(61,43,31,0.06),0 1px 2px rgba(61,43,31,0.04);
    --shadow-md:0 4px 16px rgba(61,43,31,0.07),0 2px 6px rgba(61,43,31,0.04);
    --shadow-lg:0 12px 32px rgba(61,43,31,0.1),0 4px 12px rgba(61,43,31,0.05);
  }
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;
    background:#ede4d8;font-family:'DM Sans',-apple-system,sans-serif;
    background-image:radial-gradient(ellipse at 20% 50%,rgba(212,116,75,0.08) 0%,transparent 50%),
      radial-gradient(ellipse at 80% 20%,rgba(200,150,62,0.06) 0%,transparent 50%);}
  .phone{width:390px;height:760px;background:var(--cream);border-radius:36px;
    display:flex;flex-direction:column;
    box-shadow:0 0 0 1px rgba(61,43,31,0.08),0 24px 64px rgba(61,43,31,0.15),0 8px 24px rgba(61,43,31,0.1);
    overflow:hidden;position:relative}
  .status-bar{display:flex;justify-content:space-between;align-items:center;
    padding:12px 24px 0;font-size:11px;font-weight:500;color:var(--bark)}
  .app-header{padding:6px 20px 10px;display:flex;align-items:center;justify-content:center;position:relative}
  .app-header .title{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--bark);letter-spacing:0.5px}
  .app-header .title span{color:var(--terracotta)}
  .page-content{flex:1;padding:0 16px 8px;scroll-behavior:smooth;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
  .page-content::-webkit-scrollbar{display:none}
  .tab-icon svg{width:20px;height:20px;display:block;margin:0 auto 3px;transition:transform 0.25s}

  /* Profile header */
  .profile-card{background:var(--warm-white);border-radius:16px;padding:28px 20px 20px;text-align:center;
    margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid rgba(232,213,192,0.4)}
  .avatar{width:72px;height:72px;border-radius:20px;margin:0 auto 14px;
    background:linear-gradient(135deg,var(--terracotta-light),var(--terracotta-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-lg);position:relative}
  .avatar svg{width:32px;height:32px;color:#fff}
  .nickname{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--bark);margin-bottom:2px}
  .community-info{display:flex;justify-content:center;gap:8px;margin-top:8px}
  .community-info span{background:var(--sand);color:var(--bark);padding:4px 12px;border-radius:10px;font-size:12px;font-weight:500}
  .edit-btn{display:inline-flex;align-items:center;gap:5px;margin-top:14px;font-size:12px;color:var(--terracotta);
    cursor:pointer;padding:6px 18px;border:1.5px solid rgba(196,103,60,0.3);border-radius:16px;
    transition:all 0.2s;text-decoration:none;font-weight:500}
  .edit-btn:hover{background:rgba(196,103,60,0.04);border-color:var(--terracotta)}
  .edit-btn svg{width:13px;height:13px}

  /* Notification */
  .notify-card{display:flex;align-items:center;justify-content:space-between;
    background:var(--warm-white);border-radius:16px;padding:14px 16px;margin-bottom:12px;
    cursor:pointer;box-shadow:var(--shadow-sm);border:1px solid rgba(232,213,192,0.4);
    transition:box-shadow 0.2s}
  .notify-card:active{box-shadow:var(--shadow-md)}
  .notify-left{display:flex;align-items:center;gap:12px}
  .notify-icon-wrap{width:38px;height:38px;border-radius:12px;
    background:linear-gradient(135deg,var(--gold-light),var(--gold));display:flex;
    align-items:center;justify-content:center}
  .notify-icon-wrap svg{width:18px;height:18px;color:#fff}
  .notify-label{font-size:14px;font-weight:500;color:var(--bark)}
  .notify-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .badge{background:var(--terracotta);color:#fff;font-size:11px;font-weight:600;min-width:20px;height:20px;
    border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}

  /* Menu */
  .menu-list{background:var(--warm-white);border-radius:16px;overflow:hidden;
    margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid rgba(232,213,192,0.4)}
  .menu-item{display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid rgba(232,213,192,0.3);
    font-size:14px;color:var(--bark);cursor:pointer;transition:background 0.15s;text-decoration:none}
  .menu-item:last-child{border-bottom:none}
  .menu-item:active{background:rgba(196,103,60,0.04)}
  .menu-left{display:flex;align-items:center;gap:12px}
  .menu-icon-wrap{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .menu-icon-wrap.orange{background:linear-gradient(135deg,#fce4d6,#f5cba0)}
  .menu-icon-wrap.blue{background:linear-gradient(135deg,#d6eaf8,#aed6f1)}
  .menu-icon-wrap.green{background:linear-gradient(135deg,#d5f5e3,#a9dfbf)}
  .menu-icon-wrap.gray{background:linear-gradient(135deg,#e8e8e8,#d5d5d5)}
  .menu-icon-wrap svg{width:16px;height:16px}
  .menu-icon-wrap.orange svg{color:#c4673c}
  .menu-icon-wrap.blue svg{color:#5b7fa5}
  .menu-icon-wrap.green svg{color:#6b8e5a}
  .menu-icon-wrap.gray svg{color:#888}
  .menu-label{font-size:14px;color:var(--bark)}
  .menu-value{font-size:12px;color:#b8a898}
  .arrow-svg{width:14px;height:14px;color:#d8c8b8;flex-shrink:0}

  /* Tab bar */
  .tab-bar{display:flex;background:var(--warm-white);border-top:1px solid rgba(232,213,192,0.4);position:relative}
  .tab{flex:1;text-align:center;padding:6px 0;cursor:pointer;font-size:10px;font-weight:500;
    color:#c8b8a8;transition:all 0.25s;position:relative;text-decoration:none}
  .tab.active{color:var(--terracotta);font-weight:600}
  .tab.active .tab-icon svg{transform:translateY(-2px)}
  .home-indicator{height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .home-indicator .bar{width:134px;height:5px;background:var(--bark);border-radius:3px;opacity:0.15}

  /* Settings inline */
  .setting-section{background:var(--warm-white);border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid rgba(232,213,192,0.4);overflow:hidden}
  .section-label{font-size:11px;color:#b8a898;padding:12px 4px 6px;letter-spacing:0.5px;font-weight:500}
  .setting-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(232,213,192,0.3);transition:background 0.15s}
  .setting-item:last-child{border-bottom:none}
  .setting-item:active{background:rgba(196,103,60,0.04)}
  .set-label{font-size:14px;color:var(--bark)}
  .set-arrow{color:#d8c8b8;font-size:14px}
  .set-value{font-size:12px;color:#b8a898}
  .toggle{width:50px;height:30px;border-radius:15px;background:#d8c8b8;position:relative;transition:background 0.3s;cursor:pointer;flex-shrink:0}
  .toggle.on{background:var(--terracotta)}
  .toggle .knob{width:26px;height:26px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left 0.3s;box-shadow:0 1px 3px rgba(61,43,31,0.15)}
  .toggle.on .knob{left:22px}
  .logout-btn{width:100%;padding:12px;background:var(--warm-white);color:var(--terracotta);border:1.5px solid rgba(196,103,60,0.3);border-radius:24px;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s;margin-top:4px}
  .logout-btn:active{transform:scale(0.98)}
  .modal-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(61,43,31,0.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal-overlay.show{display:flex}
  .modal-sheet{width:100%;background:var(--warm-white);border-radius:20px 20px 0 0;padding:16px 0 20px;animation:slideUp 0.35s ease}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-title{text-align:center;font-size:16px;font-weight:600;color:var(--bark);padding:8px 0 16px;border-bottom:1px solid rgba(232,213,192,0.4);margin-bottom:8px}
  .modal-action{text-align:center;padding:14px;font-size:15px;cursor:pointer;transition:background 0.15s;color:var(--bark)}
  .modal-action.danger{color:var(--terracotta);font-weight:500}
  .modal-action.cancel{color:#b8a898;margin-top:4px}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .stagger-1{animation:fadeIn 0.4s ease both}
  .stagger-2{animation:fadeIn 0.4s 0.06s ease both}
  .s1{animation:fadeIn 0.4s ease both}.s2{animation:fadeIn 0.4s 0.06s ease both}.s3{animation:fadeIn 0.4s 0.12s ease both}
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar"><span>9:41</span><span style="font-size:12px;opacity:0.5">●●● WiFi</span></div>
  <div class="app-header"><div class="title">兰园<span style="margin:0 4px">·</span><span style="color:#b8a898;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:400">我的</span></div></div>

  <div class="page-content">
    <!-- Profile -->
    <div class="profile-card stagger-1">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="nickname">兰园业主</div>
      <div class="community-info">
        <span>3号楼</span><span>2单元</span><span>1201室</span>
      </div>
      <a href="v3-edit-profile.html" class="edit-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        编辑资料
      </a>
    </div>

    <!-- Notifications -->
    <a href="v3-notifications.html" class="notify-card stagger-2" id="notifyCard" style="display:flex;align-items:center;justify-content:space-between;background:var(--warm-white);border-radius:16px;padding:14px 16px;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow-sm);border:1px solid rgba(232,213,192,0.4);transition:box-shadow 0.2s;text-decoration:none">
      <div class="notify-left">
        <div class="notify-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <span class="notify-label">消息通知</span>
      </div>
      <div class="notify-right">
        <span class="badge" id="notifyBadge">7</span>
        <svg class="arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>

    <!-- Settings inline -->
    <div class="section-label s2">隐私</div>
    <div class="setting-section s2">
      <div class="setting-item">
        <span class="set-label">显示我的楼号</span>
        <div class="toggle on" id="toggleBuilding" onclick="toggleSwitch('toggleBuilding')"><div class="knob"></div></div>
      </div>
      <div class="setting-item">
        <span class="set-label">显示我的房号</span>
        <div class="toggle" id="toggleRoom" onclick="toggleSwitch('toggleRoom')"><div class="knob"></div></div>
      </div>
    </div>

    <div class="section-label s2">其他</div>
    <div class="setting-section s2">
      <div class="setting-item"><span class="set-label">关于我们</span><span class="set-arrow">›</span></div>
      <div class="setting-item"><span class="set-label">用户协议</span><span class="set-arrow">›</span></div>
      <div class="setting-item"><span class="set-label">隐私政策</span><span class="set-arrow">›</span></div>
      <div class="setting-item"><span class="set-label">当前版本</span><span class="set-value">v1.0.0</span></div>
    </div>

    <button class="logout-btn s2" onclick="showLogoutModal()">退出登录</button>

    <div style="height:8px"></div>
  </div>

  <!-- Logout Modal -->
  <div class="modal-overlay" id="logoutModal">
    <div class="modal-sheet">
      <div class="modal-title">确认退出登录？</div>
      <div class="modal-action danger" onclick="doLogout()">退出登录</div>
      <div class="modal-action cancel" onclick="hideLogoutModal()">取消</div>
    </div>
  </div>

  <!-- Tab bar: AI → 发现 → 我 -->
  <div class="tab-bar">
    <a href="v3-ai-chat.html" class="tab">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>AI
    </a>
    <a href="v3-social-feed.html" class="tab">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>发现
    </a>
    <a href="v3-profile.html" class="tab active">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>我
    </a>
  </div>
  <div class="home-indicator"><div class="bar"></div></div>
</div>

<script>
function toggleSwitch(id) {
  document.getElementById(id).classList.toggle('on');
}
function showLogoutModal() {
  document.getElementById('logoutModal').classList.add('show');
}
function hideLogoutModal() {
  document.getElementById('logoutModal').classList.remove('show');
}
function doLogout() {
  hideLogoutModal();
  setTimeout(function(){ window.location.href = 'v3-login.html'; }, 300);
}
</script>
</body>
</html>
