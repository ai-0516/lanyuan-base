<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 兰园</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --cream:#faf7f2;--warm-white:#fffaf5;--terracotta:#c4673c;--terracotta-deep:#9b3d1a;
    --terracotta-light:#e8a87c;--ember:#d4744b;--clay:#b8532e;--sand:#f2e8dc;
    --sand-dark:#e8d5c0;--bark:#3d2b1f;--olive:#6b8e5a;--olive-light:#8aab7a;
    --gold:#c8963e;--gold-light:#e8c97a;
    --shadow-sm:0 1px 3px rgba(61,43,31,0.06),0 1px 2px rgba(61,43,31,0.04);
    --shadow-md:0 4px 16px rgba(61,43,31,0.07),0 2px 6px rgba(61,43,31,0.04);
    --shadow-lg:0 12px 32px rgba(61,43,31,0.1),0 4px 12px rgba(61,43,31,0.05);
    --shadow-glow:0 0 0 1px rgba(212,116,75,0.1),0 4px 16px rgba(212,116,75,0.12);
  }
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;
    background:#ede4d8;font-family:'DM Sans',-apple-system,sans-serif;
    background-image:radial-gradient(ellipse at 20% 50%,rgba(212,116,75,0.08) 0%,transparent 50%),
      radial-gradient(ellipse at 80% 20%,rgba(200,150,62,0.06) 0%,transparent 50%);}
  .phone{width:390px;height:760px;background:var(--cream);border-radius:36px;
    display:flex;flex-direction:column;
    box-shadow:0 0 0 1px rgba(61,43,31,0.08),0 24px 64px rgba(61,43,31,0.15),0 8px 24px rgba(61,43,31,0.1);
    overflow:hidden;position:relative}
  .status-bar{display:flex;justify-content:space-between;align-items:center;
    padding:12px 24px 0;font-size:11px;font-weight:500;color:var(--bark)}
  .content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center}
  .app-icon{width:80px;height:80px;border-radius:20px;
    background:linear-gradient(135deg,var(--terracotta-light),var(--terracotta));
    display:flex;align-items:center;justify-content:center;margin-bottom:24px;
    color:#fff;font-size:30px;font-weight:700;box-shadow:var(--shadow-lg)}
  .app-name{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--bark);letter-spacing:2px;margin-bottom:4px}
  .app-name span{color:var(--terracotta)}
  .app-desc{font-size:14px;color:#b8a898;line-height:1.6;margin-bottom:40px}
  .app-desc{font-size:14px;color:#b8a898;line-height:1.6;margin-bottom:52px}
  .login-btn{width:100%;max-width:280px;padding:14px 0;
    background:linear-gradient(135deg,var(--ember),var(--clay));color:#fff;
    border:none;border-radius:24px;font-size:16px;font-weight:600;cursor:pointer;
    letter-spacing:0.5px;box-shadow:var(--shadow-lg);
    transition:transform 0.2s,box-shadow 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
  .login-btn:hover{transform:scale(1.02);box-shadow:0 16px 40px rgba(196,103,60,0.25)}
  .login-btn:active{transform:scale(0.97)}
  .login-btn svg{width:20px;height:20px;opacity:0.9}
  .agree-text{font-size:11px;color:#b8a898;margin-top:18px;line-height:1.6}
  .agree-text a{color:var(--terracotta);text-decoration:none}
  .home-indicator{height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .home-indicator .bar{width:134px;height:5px;background:var(--bark);border-radius:3px;opacity:0.15}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .stagger-1{animation:fadeIn 0.5s ease both}
  .stagger-2{animation:fadeIn 0.5s 0.08s ease both}
  .stagger-3{animation:fadeIn 0.5s 0.16s ease both}
  .stagger-4{animation:fadeIn 0.5s 0.24s ease both}
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar"><span>9:41</span><span style="font-size:12px;opacity:0.5">●●● WiFi</span></div>
  <div class="content">
    <div class="app-icon stagger-1">兰</div>
    <div class="app-name stagger-2">东方<span>兰园</span></div>
    <div class="app-desc stagger-2">你的社区生活好帮手</div>
    <button class="login-btn stagger-3" onclick="this.textContent='登录中…';this.style.opacity='0.8'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.69 11.94c.53 0 .96.42.96.94s-.43.94-.96.94-.96-.42-.96-.94.43-.94.96-.94zm4.62 0c.53 0 .96.42.96.94s-.43.94-.96.94-.96-.42-.96-.94.43-.94.96-.94z"/><path d="M21.2 13.43c0-3.97-3.52-7.2-7.85-7.2-4.33 0-7.85 3.23-7.85 7.2 0 3.53 2.92 6.49 6.82 7.06l1.03.53-1.58 1.6-.41.41.7-.07 3.23-.34c4.33-.49 7.91-3.68 7.91-7.39zm-12.69-1.49c0-.53.43-.94.96-.94s.96.42.96.94-.43.94-.96.94-.96-.42-.96-.94zm4.62 0c0-.53.43-.94.96-.94s.96.42.96.94-.43.94-.96.94-.96-.42-.96-.94zm-2.24 5.21c-.48.23-1.03-.11-.92-.56.11-.45.64-.72 1.12-.49.48.23.67.74.28 1.05z"/></svg>
      微信一键登录
    </button>
    <div class="agree-text stagger-4">登录即表示同意 <a href="#">《用户协议》</a> 和 <a href="#">《隐私政策》</a></div>
  </div>
  <div class="home-indicator"><div class="bar"></div></div>
</div>
</body>
</html>
