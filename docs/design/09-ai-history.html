<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对话历史 · 兰园</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#e8e8e8;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.phone{width:375px;height:812px;background:#fff;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.12);display:flex;flex-direction:column}
.status-bar{height:44px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600;flex-shrink:0;color:#1a1a1a}
.nav-bar{height:44px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:17px;font-weight:600;flex-shrink:0}
.nav-bar .back{font-size:15px;color:#07C160;cursor:pointer;text-decoration:none;font-weight:500}
.nav-bar .edit-btn{font-size:14px;color:#07C160;cursor:pointer;border:none;background:none;font-weight:500}
.nav-bar .done-btn{font-size:14px;color:#07C160;font-weight:600;cursor:pointer;border:none;background:none;display:none}
.page-content{flex:1;overflow-y:auto}

.conv-item{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background 0.15s;gap:12px}
.conv-item:hover{background:#fafafa}
.conv-check{display:none;width:22px;height:22px;border-radius:50%;border:2px solid #ddd;margin-right:2px;flex-shrink:0;align-items:center;justify-content:center;transition:all 0.2s}
.conv-check svg{width:12px;height:12px;color:#fff;display:none}
.conv-check.checked{background:#07C160;border-color:#07C160}
.conv-check.checked svg{display:block}
.conv-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#E8F0FE,#D0E4FD);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.conv-icon svg{width:20px;height:20px;color:#3B82F6}
.conv-body{flex:1;min-width:0}
.conv-title{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-preview{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-time{font-size:11px;color:#ccc;flex-shrink:0}

.edit-mode .conv-item{cursor:default}
.edit-mode .conv-item:hover{background:#fff}
.edit-mode .conv-check{display:flex}
.edit-mode .conv-item.selected{background:#F0FAF4}
.edit-mode .nav-bar .edit-btn{display:none}
.edit-mode .nav-bar .done-btn{display:block}

/* Batch bar */
.batch-bar{display:none;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;border-top:1px solid #eee;flex-shrink:0}
.batch-bar.show{display:flex}
.batch-delete{color:#FF3B30;font-size:14px;cursor:pointer;padding:8px 16px;border-radius:8px;transition:background 0.15s;font-weight:500}
.batch-delete:hover{background:#FFF0EF}
.batch-count{font-size:14px;color:#666}

/* Rename modal */
.modal-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:50}
.modal-overlay.show{display:flex}
.modal-dialog{width:280px;background:#fff;border-radius:14px;padding:24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
.modal-title{font-size:17px;font-weight:600;color:#1a1a1a;margin-bottom:16px}
.modal-input{width:100%;padding:10px 14px;border:1.5px solid #e5e5e5;border-radius:10px;font-size:15px;outline:none;font-family:inherit;margin-bottom:16px;transition:border-color 0.2s}
.modal-input:focus{border-color:#07C160}
.modal-buttons{display:flex;gap:10px}
.modal-btn{flex:1;padding:11px;border-radius:10px;font-size:15px;cursor:pointer;border:none;transition:all 0.15s;font-weight:500}
.modal-btn.cancel{background:#f5f5f5;color:#666}
.modal-btn.cancel:hover{background:#eee}
.modal-btn.confirm{background:#07C160;color:#fff}
.modal-btn.confirm:hover{background:#06AD56}
.home-indicator{height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.home-indicator .bar{width:134px;height:5px;background:#1a1a1a;border-radius:3px}
</style>
</head>
<body>

<!-- ── design version pinned at commit ── -->
<div style="position:fixed;bottom:12px;right:12px;z-index:99999;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:11px;font-family:SFMono-Regular,Consolas,monospace;padding:5px 10px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.25);pointer-events:none;letter-spacing:0.3px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="9a9f676 · design: v2 迭代 — SVG 图标 + 评论直显 + AI 历史首页 + 设计感提升">🏷️ <a href="https://github.com/snxly/lanyuan-base/commit/9a9f676" target="_blank" style="color:#8cf;text-decoration:none">9a9f676</a> · design: v2 迭代 — SVG 图标 + 评论直显 + AI 历史首页 + 设计感提升</div>

<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <svg width="66" height="12" viewBox="0 0 66 12"><rect x="0" y="0" width="18" height="12" rx="2" fill="#1a1a1a"/><rect x="20" y="2" width="18" height="8" rx="2" fill="#1a1a1a"/><rect x="40" y="4" width="18" height="4" rx="2" fill="#1a1a1a"/><rect x="60" y="1" width="4" height="10" rx="1" fill="#1a1a1a"/></svg>
  </div>
  <div class="nav-bar" id="navBar">
    <a href="08-ai-chat.html" class="back">‹ 返回</a>
    <span>对话历史</span>
    <button class="edit-btn" onclick="toggleEdit()">管理</button>
    <button class="done-btn" onclick="toggleEdit()">完成</button>
  </div>

  <div class="page-content" id="convList">
    <div class="conv-item" id="conv1" onclick="openConv(this, event)">
      <div class="conv-check" onclick="event.stopPropagation();toggleCheck(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="conv-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div class="conv-body">
        <div class="conv-title">小区物业电话咨询</div>
        <div class="conv-preview">兰园小区物业服务中心 ☎️ 010-8888-6666...</div>
      </div>
      <span class="conv-time">昨天</span>
    </div>

    <div class="conv-item" id="conv2" onclick="openConv(this, event)">
      <div class="conv-check" onclick="event.stopPropagation();toggleCheck(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="conv-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div class="conv-body">
        <div class="conv-title">周末去哪玩推荐</div>
        <div class="conv-preview">北京周末好去处 🌿 奥林匹克森林公园、798...</div>
      </div>
      <span class="conv-time">3天前</span>
    </div>

    <div class="conv-item" id="conv3" onclick="openConv(this, event)">
      <div class="conv-check" onclick="event.stopPropagation();toggleCheck(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="conv-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div class="conv-body">
        <div class="conv-title">周边美食推荐</div>
        <div class="conv-preview">小区周边美食推荐 🍜 老北京炸酱面、蜀九香...</div>
      </div>
      <span class="conv-time">1周前</span>
    </div>
  </div>

  <!-- Batch bar -->
  <div class="batch-bar" id="batchBar">
    <span class="batch-count" id="batchCount">已选择 0 项</span>
    <span class="batch-delete" onclick="batchDelete()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px;margin-right:2px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      删除
    </span>
  </div>

  <!-- Rename modal -->
  <div class="modal-overlay" id="renameModal">
    <div class="modal-dialog">
      <div class="modal-title">重命名对话</div>
      <input class="modal-input" id="renameInput" placeholder="输入新名称">
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="hideRename()">取消</button>
        <button class="modal-btn confirm" onclick="doRename()">确定</button>
      </div>
    </div>
  </div>

  <div class="home-indicator"><div class="bar"></div></div>
</div>

<script>
var editMode = false;
var renameTarget = null;

function toggleEdit() {
  editMode = !editMode;
  var list = document.getElementById('convList');
  var batchBar = document.getElementById('batchBar');
  if (editMode) {
    list.classList.add('edit-mode');
    list.querySelectorAll('.conv-check.checked').forEach(function(c) { c.classList.remove('checked'); });
    updateBatchCount();
  } else {
    list.classList.remove('edit-mode');
    batchBar.classList.remove('show');
    list.querySelectorAll('.conv-item').forEach(function(i) { i.classList.remove('selected'); });
    list.querySelectorAll('.conv-check').forEach(function(c) { c.classList.remove('checked'); });
  }
}

function toggleCheck(check) {
  if (!editMode) return;
  check.classList.toggle('checked');
  check.closest('.conv-item').classList.toggle('selected');
  updateBatchCount();
}

function updateBatchCount() {
  var count = document.querySelectorAll('.conv-check.checked').length;
  var batchBar = document.getElementById('batchBar');
  document.getElementById('batchCount').textContent = '已选择 ' + count + ' 项';
  if (count > 0) batchBar.classList.add('show');
  else batchBar.classList.remove('show');
}

function openConv(item, event) {
  if (editMode) {
    toggleCheck(item.querySelector('.conv-check'));
    return;
  }
  window.location.href = '08-ai-chat.html';
}

function showRename(id) {
  renameTarget = id;
  var title = document.getElementById(id).querySelector('.conv-title').textContent;
  document.getElementById('renameInput').value = title;
  document.getElementById('renameModal').classList.add('show');
}

function hideRename() {
  document.getElementById('renameModal').classList.remove('show');
  renameTarget = null;
}

function doRename() {
  var newName = document.getElementById('renameInput').value.trim();
  if (newName && renameTarget) {
    document.getElementById(renameTarget).querySelector('.conv-title').textContent = newName;
  }
  hideRename();
}

function batchDelete() {
  document.querySelectorAll('.conv-check.checked').forEach(function(c) {
    var item = c.closest('.conv-item');
    item.style.opacity = '0';
    item.style.transform = 'translateX(-120%)';
    item.style.transition = 'all 0.3s';
    setTimeout(function() { item.remove(); }, 300);
  });
  toggleEdit();
}
</script>
</body>
</html>
