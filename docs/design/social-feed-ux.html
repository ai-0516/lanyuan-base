<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暖邻 · 社交广场 | ui-ux-pro-max</title>
<style>
/* ═══════════════════════════════════════════
   ui-ux-pro-max — 系统化交互 · 可访问
   不做手机框，做全屏可滚动内容区+底部导航
   ═══════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px}
/* 手机框架 */
.phone{width:375px;height:760px;background:#FAF7F2;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.5);display:flex;flex-direction:column}
/* 顶部 — 完整状态栏+导航 */
.top-area{flex-shrink:0}
.status-bar{height:40px;background:#FAF7F2;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:600;color:#6B5E53}
/* 搜索栏 + 通知 */
.search-row{display:flex;align-items:center;gap:12px;padding:8px 16px 10px;background:#FAF7F2}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:#EDE4D8;border-radius:10px;padding:8px 14px}
.search-box input{border:none;background:none;outline:none;font-size:13px;color:#4A3B2F;font-family:inherit;width:100%}
.search-box input::placeholder{color:#B8A898}
.search-box svg{width:16px;height:16px;color:#8B7355;flex-shrink:0}
.notify-btn{min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;background:#EDE4D8;border:none;border-radius:50%;cursor:pointer;color:#8B7355}
/* 分类筛选 chips — ui-ux-pro-max 签名：可滚动标签 */
.filter-scroll{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-scroll::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 16px;border-radius:16px;font-size:12px;font-weight:600;white-space:nowrap;border:1.5px solid #EDE4D8;background:#FFFBF6;color:#8B7355;cursor:pointer;flex-shrink:0;transition:all .15s;min-height:32px;display:flex;align-items:center}
.filter-chip.active{background:#D4845A;color:#fff;border-color:#D4845A}
.filter-chip:focus-visible{outline:3px solid #D4845A;outline-offset:2px}
/* 内容区 */
.feed{flex:1;overflow-y:auto;padding:0 14px 8px}
/* 帖子 — 清晰的信息层级 */
.post{background:#FFFBF6;border-radius:16px;margin-bottom:12px;border:1px solid #EDE4D8;overflow:hidden}
.post:focus-within{box-shadow:0 0 0 3px rgba(212,132,90,0.2)}
/* 帖子头部 */
.post-top{display:flex;align-items:center;gap:12px;padding:14px 14px 0}
.post-avatar{min-width:44px;min-height:44px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;flex-shrink:0}
.av1{background:#E8B4A2}.av2{background:#C4A882}.av3{background:#B8C9A8}.av4{background:#A2B4C8}
.post-info{flex:1;min-width:0}
.post-author{font-size:15px;font-weight:600;color:#4A3B2F}
.post-address{font-size:11px;color:#B8A898;margin-top:1px;display:flex;align-items:center;gap:6px}
.post-address .bldg{font-weight:700;color:#D4845A}
/* 更多按钮 */
.post-more{min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;color:#B8A898;border-radius:50%}
.post-more:focus-visible{outline:3px solid #D4845A;outline-offset:2px}
/* 帖子正文 */
.post-body{padding:10px 14px}
.post-text{font-size:15px;line-height:1.6;color:#4A3B2F}
.post-image{width:100%;height:180px;background:#e8d8c8;border-radius:10px;margin-top:8px;display:flex;align-items:center;justify-content:center;color:#a08060;font-size:16px;border:2px dashed #d8c8b0}
/* 互动栏 */
.post-bar{display:flex;align-items:center;gap:0;padding:8px 14px 10px;border-top:0}
.post-stats{display:flex;gap:4px;font-size:11px;color:#B8A898;align-items:center}
.post-stats svg{width:14px;height:14px}
/* 操作按钮 — 全部 ≥44pt */
.post-actions{display:flex;gap:2px;padding:4px 14px 12px}
.act-btn{min-width:44px;min-height:44px;display:flex;align-items:center;gap:4px;padding:8px 12px;border:none;background:none;border-radius:10px;font-size:13px;color:#8B7355;cursor:pointer;font-family:inherit;transition:background .15s}
.act-btn:hover,.act-btn:focus-visible{background:rgba(212,132,90,0.08)}
.act-btn:focus-visible{outline:3px solid #D4845A;outline-offset:-1px}
.act-btn.liked{color:#D4845A}
.act-btn.liked svg{fill:#D4845A}
.act-btn svg{width:20px;height:20px;flex-shrink:0}
/* 评论区 */
.post-comments{padding:0 14px 12px}
.comment-item{display:flex;gap:8px;padding:5px 0;align-items:flex-start}
.comment-avatar{min-width:28px;min-height:28px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.comment-body{font-size:13px;color:#6B5E53;line-height:1.5}
.comment-body strong{color:#D4845A;font-weight:600;margin-right:4px}
.show-more{font-size:11px;color:#B8A898;padding:3px 0;cursor:pointer;min-height:28px;display:flex;align-items:center;border:none;background:none}
/* 快速回复 */
.quick-reply{display:flex;gap:8px;padding:8px 14px 14px;border-top:1px solid #F0E8DA;align-items:center}
.quick-reply input{flex:1;min-height:40px;padding:8px 14px;border:1.5px solid #EDE4D8;border-radius:20px;font-size:13px;outline:none;font-family:inherit;background:#FAF7F2;color:#4A3B2F}
.quick-reply input:focus{border-color:#D4845A;box-shadow:0 0 0 3px rgba(212,132,90,0.12)}
.quick-reply input::placeholder{color:#C8B8A8}
.quick-reply button{min-width:44px;min-height:40px;padding:6px 14px;border:none;background:#D4845A;color:#fff;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.quick-reply button:disabled{opacity:.4;cursor:not-allowed}
/* 底部导航 */
.bottom-nav{height:56px;background:#FFFBF6;border-top:1px solid #EDE4D8;display:flex;align-items:center;flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#B8A898;font-size:10px;gap:1px;cursor:pointer;border:none;background:none;font-family:inherit;min-height:48px}
.nav-item.active{color:#D4845A}
.nav-item:focus-visible{outline:3px solid #D4845A;outline-offset:-3px}
.nav-item svg{width:22px;height:22px}
.nav-badge{position:relative}
.nav-badge::after{content:'3';position:absolute;top:-6px;right:-10px;background:#D4845A;color:#fff;font-size:9px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.home-bar{height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#FFFBF6}
.home-bar span{width:120px;height:4px;background:#6B5E53;border-radius:2px;opacity:.25}
/* reduced-motion */
@media(prefers-reduced-motion:reduce){*{transition-duration:0s!important}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>

<script>

document.querySelectorAll('.filter-chip').forEach(c=>c.onclick=function(){document.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));this.classList.add('active')})
